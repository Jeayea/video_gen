[project]
name = "videogen"
version = "0.19.0"
description = "剧本生成 + AI 短剧自动化流水线（文本 → 视频 → 配音 → 成片）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "edge-tts>=6.1",  # 配音（Edge-TTS，免费但要联网）
]

[project.optional-dependencies]
# 便携 ffmpeg（pip 装一个自带二进制，不用 brew）；视频阶段需要
media = ["imageio-ffmpeg>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
# 代码库是中文注释/文案，全角标点是有意为之
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

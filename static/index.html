<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>videogen — AI 短剧流水线</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e4e7;
  --text2: #9ca3af;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
.header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.header h1 { font-size: 18px; font-weight: 600; }
.header .badge {
  background: var(--accent); color: #fff;
  font-size: 11px; padding: 2px 8px; border-radius: 99px;
}
.layout {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 57px);
}
.sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
}
.sidebar h2 { font-size: 13px; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.create-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.create-form label { font-size: 12px; color: var(--text2); }
.create-form input, .create-form select, .create-form textarea {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; color: var(--text);
  font-size: 13px; outline: none;
}
.create-form textarea { resize: vertical; min-height: 60px; }
.create-form input:focus, .create-form textarea:focus, .create-form select:focus {
  border-color: var(--accent);
}
.btn {
  background: var(--accent); color: #fff; border: none;
  padding: 8px 16px; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 500;
  transition: background 0.15s;
}
.btn:hover { background: var(--accent2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-outline {
  background: transparent; border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent2); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-green { background: var(--green); }
.btn-green:hover { background: #16a34a; }
.btn-yellow { background: var(--yellow); color: #000; }
.btn-yellow:hover { background: #ca8a04; }
.btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }

.project-list { display: flex; flex-direction: column; gap: 6px; }
.project-item {
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.15s;
  position: relative;
}
.project-item:hover { background: var(--surface); }
.project-item.active { border-color: var(--accent); background: var(--surface); }
.project-item .title { font-size: 13px; font-weight: 500; padding-right: 20px; }
.project-item .meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
.project-item .del {
  position: absolute; top: 8px; right: 8px;
  background: transparent; border: none; color: var(--text2);
  cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px;
  border-radius: 4px; display: none;
}
.project-item:hover .del { display: block; }
.project-item .del:hover { color: var(--red); background: #7f1d1d33; }

.main { overflow-y: auto; padding: 24px; }
.empty { text-align: center; padding: 80px 20px; color: var(--text2); }
.empty h3 { font-size: 16px; margin-bottom: 8px; }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.panel.pending { opacity: 0.75; border-style: dashed; }
.panel h3 {
  font-size: 14px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.panel h3 .num {
  background: var(--accent); color: #fff;
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}
.panel-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--text2); line-height: 1.7; }

.status-tag {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 99px; font-weight: 500;
}
.status-draft { background: #374151; color: #d1d5db; }
.status-script_review { background: #78350f; color: #fbbf24; }
.status-storyboard_review { background: #78350f; color: #fbbf24; }
.status-script_confirmed { background: #14532d; color: #4ade80; }
.status-storyboard_confirmed { background: #14532d; color: #4ade80; }
.status-failed { background: #7f1d1d; color: #fca5a5; }
.status-done { background: #14532d; color: #4ade80; }

.tag-mini {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text2);
}
.tag-mini.warn { border-color: var(--yellow); color: var(--yellow); }
.tag-mini.ok { border-color: var(--green); color: var(--green); }

.script-content { font-size: 13px; line-height: 1.6; }
.scene-block {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin-bottom: 10px;
}
.scene-block .heading { font-weight: 600; font-size: 13px; color: var(--accent2); }
.scene-block .summary { color: var(--text2); font-size: 12px; margin: 4px 0 8px; }
.scene-block .dialogue { font-size: 12px; }
.scene-block .dialogue .speaker { color: var(--accent2); font-weight: 500; }
.scene-block .duration { font-size: 11px; color: var(--text2); margin-top: 6px; }

.shot-block {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px; font-size: 12px;
}
.shot-block .shot-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.shot-block .shot-no { font-weight: 600; color: var(--accent2); }
.shot-block .camera { color: var(--text2); }
.shot-block .prompt {
  background: var(--bg); border-radius: 4px; padding: 6px 8px;
  margin-top: 6px; font-family: monospace; font-size: 11px;
  color: #a5b4fc; word-break: break-all;
}

.issue-list { margin-top: 8px; }
.issue-item {
  font-size: 12px; padding: 6px 10px; border-radius: 6px;
  margin-bottom: 4px; display: flex; gap: 8px; align-items: flex-start;
}
.issue-error { background: #7f1d1d33; border-left: 3px solid var(--red); }
.issue-warning { background: #78350f33; border-left: 3px solid var(--yellow); }
.issue-info { background: #1e3a5f33; border-left: 3px solid #60a5fa; }

.loading {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.bible-chars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.char-tag {
  background: var(--bg); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 6px; font-size: 12px;
}
.char-tag .name { font-weight: 500; }
.char-tag .role { color: var(--text2); font-size: 11px; }
.char-tag .ref-thumb {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
  border: 1px solid var(--border); background: #000;
}
.char-tag .ref-thumb.empty {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text2);
}

/* JSON Editor */
.json-editor {
  display: none;
  margin-top: 10px;
}
.json-editor.active { display: block; }
.json-editor textarea {
  width: 100%;
  min-height: 320px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: #93c5fd;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  tab-size: 2;
}
.json-editor textarea:focus { border-color: var(--accent); }
.json-editor .editor-actions {
  display: flex; gap: 8px; margin-top: 8px; align-items: center;
}
.json-editor .error-msg {
  color: var(--red); font-size: 12px; margin-left: 8px;
}

/* Scene/Shot edit forms */
.edit-form {
  display: none;
  margin-top: 10px;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.edit-form.active { display: block; }
.edit-form label {
  display: block; font-size: 11px; color: var(--text2);
  margin-bottom: 4px; margin-top: 8px;
}
.edit-form label:first-child { margin-top: 0; }
.edit-form input, .edit-form textarea, .edit-form select {
  width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; color: var(--text);
  font-size: 12px; outline: none;
}
.edit-form textarea { resize: vertical; min-height: 50px; font-family: inherit; }
.edit-form input:focus, .edit-form textarea:focus { border-color: var(--accent); }
.edit-form .row { display: flex; gap: 8px; }
.edit-form .row > * { flex: 1; }
.edit-form .form-actions { display: flex; gap: 8px; margin-top: 12px; }

.scene-actions { display: flex; gap: 6px; margin-top: 8px; }
.shot-actions { display: flex; gap: 6px; margin-top: 6px; }

/* 视频片段 */
.clip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px; margin-top: 10px;
}
.clip-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px; background: var(--bg); font-size: 12px;
}
.clip-card video {
  width: 100%; border-radius: 6px; background: #000; display: block;
  aspect-ratio: 9 / 16; object-fit: contain;
}
.clip-card .clip-head {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;
}
.clip-card .clip-no { font-weight: 600; color: var(--accent2); }
.clip-card .clip-prompt {
  color: var(--text2); font-size: 11px; margin-top: 6px; line-height: 1.5;
  max-height: 52px; overflow: hidden;
}
.clip-card .clip-error { color: var(--red); font-size: 11px; margin-top: 6px; }
.clip-card.pending { opacity: 0.6; }

.char-tag .ref-upload {
  font-size: 10px; color: var(--accent2); cursor: pointer; border: 1px dashed var(--border);
  border-radius: 4px; padding: 0 4px; margin-left: 4px;
}
.char-tag .ref-upload input { display: none; }
.btn-xs { padding: 0 5px; font-size: 10px; }
.cost-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cost-table th, .cost-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.cost-table thead th { color: var(--text2); font-weight: 500; }
.cost-table tfoot th { color: var(--text); }
.voice-map { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.voice-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.voice-row .voice-name { color: var(--text2); }
.voice-row select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 6px; font-size: 12px; font-family: inherit;
}
.clip-card audio { width: 100%; height: 32px; margin-top: 6px; }
.progress-wrap { margin-top: 10px; }
.progress-bar {
  height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; background: var(--accent); width: 0%;
  transition: width 0.3s ease;
}
.progress-text { font-size: 12px; color: var(--text2); margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>videogen</h1>
  <span class="badge">v0.12</span>
  <span style="flex:1"></span>
  <span id="health" style="font-size:12px;color:var(--text2)"></span>
  <span id="global-status" style="font-size:12px;color:var(--text2)"></span>
</div>

<div class="layout">
  <div class="sidebar">
    <h2>新建项目</h2>
    <div class="create-form">
      <label>标题</label>
      <input id="inp-title" placeholder="都市逆袭短剧" value="">
      <label>输入模式</label>
      <select id="inp-mode">
        <option value="theme">主题/关键词</option>
        <option value="outline">故事大纲</option>
        <option value="full_script">完整剧本</option>
      </select>
      <label>输入内容</label>
      <textarea id="inp-text" placeholder="例如：一个被裁员的程序员靠 AI 逆袭创业"></textarea>
      <label>画面比例</label>
      <select id="inp-aspect">
        <option value="9:16">竖屏 9:16（抖音）</option>
        <option value="16:9">横屏 16:9（B站）</option>
        <option value="1:1">方形 1:1</option>
      </select>
      <label>目标时长（秒）</label>
      <input id="inp-duration" type="number" value="45" min="5" max="600">
      <button class="btn" onclick="createProject()">创建项目</button>
    </div>

    <h2>项目列表</h2>
    <div class="project-list" id="project-list"></div>
  </div>

  <div class="main" id="main">
    <div class="empty">
      <h3>选择或创建一个项目</h3>
      <p>输入创意 → 生成圣经 → 生成剧本 → 确认 → 生成分镜 → 确认</p>
    </div>
  </div>
</div>

<script>
// ── 状态与鉴权 ──────────────────────────────────────────────────────

const STATUS_LABEL = {
  draft: '草稿',
  script_review: '剧本待确认',
  script_confirmed: '剧本已确认',
  storyboard_review: '分镜待确认',
  storyboard_confirmed: '分镜已确认',
  video_generating: '视频生成中',
  video_ready: '视频就绪',
  audio_generating: '配音生成中',
  audio_ready: '配音就绪',
  composing: '合成中',
  done: '完成',
  failed: '失败',
};

// 支持 ?token=xxx 一次性注入，然后记住
(function initToken() {
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (fromUrl) {
    localStorage.setItem('videogen_token', fromUrl);
    history.replaceState(null, '', location.pathname);
  }
})();

function authHeaders() {
  const token = localStorage.getItem('videogen_token');
  return token ? { 'X-API-Token': token } : {};
}

let currentProjectId = null;
let currentBible = null;
let currentScript = null;
let currentStoryboard = null;
let currentProject = null;
let currentVideo = null;
let currentAudio = null;
let currentCompose = null;
let currentCost = null;
let currentBatch = null;
let serverHealth = null;
let modelInfo = null;
let costPollTimer = null;
let batchPollTimer = null;
let videoPollTimer = null;
let audioPollTimer = null;
let composePollTimer = null;

const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    ...opts,
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.detail || resp.statusText);
  }
  return resp.json();
}

function statusTag(status) {
  const label = STATUS_LABEL[status] || status;
  return `<span class="status-tag status-${status}">${esc(label)}</span>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function el(id) { return $(id); }

// ── 通用动作包装：忙提示 + 刷新 ─────────────────────────────────────

async function withBusy(label, fn) {
  $('global-status').innerHTML = `<span class="loading"></span>${esc(label)}`;
  try {
    await fn();
    await refresh();
  } catch (e) {
    alert(`${label}失败：${e.message}`);
  } finally {
    $('global-status').textContent = '';
  }
}

async function refresh() {
  await loadProjects();
  if (currentProjectId) await renderProject(currentProjectId);
}

async function loadHealth() {
  try {
    const h = await api('/api/health');
    serverHealth = h;
    const ok = h.llm_key_configured;
    $('health').innerHTML =
      `<span class="tag-mini ${ok ? 'ok' : 'warn'}">LLM ${ok ? '已配置' : '未配置 Key'}</span>` +
      (h.ffmpeg_can_burn_subtitles ? ' <span class="tag-mini ok">可烧字幕</span>' : '') +
      (h.auth_enabled ? ' <span class="tag-mini ok">鉴权开启</span>' : '');
    // 配音文案的默认模式跟着服务端配置走（off = 不额外花钱）
    if (h.audio_script_mode && SCRIPT_MODES.some(([value]) => value === h.audio_script_mode)) {
      audioScriptMode = h.audio_script_mode;
    }
    if (typeof h.audio_script_vision === 'boolean') audioScriptVision = h.audio_script_vision;
  } catch (e) {
    $('health').textContent = '';
  }
}

// ── 项目列表 ────────────────────────────────────────────────────────

async function loadProjects() {
  const projects = await api('/api/projects');
  const list = $('project-list');
  if (projects.length === 0) {
    list.innerHTML = '<p style="font-size:12px;color:var(--text2)">暂无项目</p>';
    return;
  }
  list.innerHTML = projects.map(p => `
    <div class="project-item ${p.id === currentProjectId ? 'active' : ''}"
         onclick="selectProject('${p.id}')">
      <button class="del" title="删除项目"
              onclick="event.stopPropagation(); deleteProject('${p.id}', '${esc(p.title)}')">✕</button>
      <div class="title">${esc(p.title) || '未命名'}</div>
      <div class="meta">${statusTag(p.status)} · ${p.aspect_ratio} · ${p.target_duration_sec}s</div>
    </div>
  `).join('');
}

async function createProject() {
  const body = {
    title: $('inp-title').value || '未命名项目',
    input_mode: $('inp-mode').value,
    input_text: $('inp-text').value,
    aspect_ratio: $('inp-aspect').value,
    target_duration_sec: parseInt($('inp-duration').value) || 45,
  };
  if (!body.input_text.trim()) { alert('请输入内容'); return; }
  try {
    $('global-status').textContent = '创建中...';
    const p = await api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
    currentProjectId = p.id;
    await refresh();
  } catch (e) {
    alert('创建失败: ' + e.message);
  } finally {
    $('global-status').textContent = '';
  }
}

async function selectProject(id) {
  currentProjectId = id;
  await refresh();
}

async function deleteProject(id, title) {
  if (!confirm(`确定删除项目「${title}」？该操作会删除磁盘上的全部产物。`)) return;
  try {
    await api(`/api/projects/${id}`, { method: 'DELETE' });
    if (currentProjectId === id) {
      currentProjectId = null;
      $('main').innerHTML = '<div class="empty"><h3>项目已删除</h3><p>在左侧选择或创建项目</p></div>';
    }
    await loadProjects();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// ── 渲染 ────────────────────────────────────────────────────────────

async function safeGet(path) {
  try { return await api(path); } catch (e) { return null; }
}

async function renderProject(id) {
  const p = await api(`/api/projects/${id}`);
  currentProject = p;
  const main = $('main');

  // 先取数据再渲染，避免用到上一个项目残留的 currentScript/currentStoryboard
  currentBible = await safeGet(`/api/projects/${id}/bible`);
  currentScript = await safeGet(`/api/projects/${id}/script`);
  currentStoryboard = await safeGet(`/api/projects/${id}/storyboard`);
  currentVideo = await safeGet(`/api/projects/${id}/video/status`);
  currentAudio = await safeGet(`/api/projects/${id}/audio/status`);
  currentCompose = await safeGet(`/api/projects/${id}/compose/status`);
  currentCost = await safeGet(`/api/projects/${id}/cost`);
  await loadPreflight('all');
  if (!modelInfo) modelInfo = await safeGet('/api/models');
  // 刷新页面后也能看到最近一次批量任务（进行中的继续轮询）
  if (!currentBatch || !currentBatch.is_active) {
    const batchList = await safeGet('/api/batches?limit=1');
    if (Array.isArray(batchList) && batchList.length) currentBatch = batchList[0];
  }

  const scriptTotal = currentScript ? currentScript.scenes.reduce((a, s) => a + s.duration_sec, 0) : null;

  let html = `
    <div class="panel">
      <h3>项目信息 ${statusTag(p.status)}</h3>
      <div style="font-size:13px;color:var(--text2)">
        <strong style="color:var(--text)">${esc(p.title)}</strong> ·
        ${p.aspect_ratio} · 目标 ${p.target_duration_sec}s ·
        输入模式: ${esc(p.input_mode)}
      </div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px">
        输入: ${esc((p.input_text || '').substring(0, 100))}${(p.input_text || '').length > 100 ? '...' : ''}
      </div>
      <div style="font-size:12px;color:var(--text2);margin-top:6px">
        下一步：${esc(nextStep(p.status))}
      </div>
      <div class="voice-row" style="margin-top:8px">
        <span class="voice-name">LLM 模型</span>
        <select id="project-model"></select>

async function loadConsistency(pid) {
  const cel = $('consistency-content');
  if (!cel) return;
  try {
    const report = await api(`/api/projects/${pid}/consistency`);
    if (!report.issues.length) {
      cel.innerHTML = '<div style="margin-top:10px;font-size:12px;color:var(--text2)">一致性校验：无问题</div>';
      return;
    }
    const errs = report.issues.filter(i => i.severity === 'error').length;
    const warns = report.issues.filter(i => i.severity === 'warning').length;
    cel.innerHTML = `
      <div style="margin-top:10px;font-size:12px;color:var(--text2)">
        一致性校验（${esc(report.stage || 'script')}）：
        <span class="tag-mini ${errs ? 'warn' : ''}">${errs} 错误</span>
        <span class="tag-mini ${warns ? 'warn' : ''}">${warns} 警告</span>
        <span class="tag-mini">${report.issues.length - errs - warns} 提示</span>
      </div>
      <div class="issue-list">
        ${report.issues.map(i => `
          <div class="issue-item issue-${i.severity}">
            <span>${esc(i.message)}${i.scene_id ? ` <span class="tag-mini">${esc(i.scene_id)}</span>` : ''}</span>
          </div>
        `).join('')}
      </div>
    `;
  } catch (e) { cel.innerHTML = ''; }
}

function toggleSceneEdit(si) {
  const elem = $(`scene-edit-${si}`);
  if (elem) elem.classList.toggle('active');
}

async function saveScene(si) {
  if (!currentScript) return;
  const scene = currentScript.scenes[si];
  scene.heading = $(`se-${si}-heading`).value;
  scene.summary = $(`se-${si}-summary`).value;
  scene.emotion = $(`se-${si}-emotion`).value;
  scene.duration_sec = parseInt($(`se-${si}-duration`).value) || scene.duration_sec;

  const dlgText = $(`se-${si}-dialogue`).value.trim();
  scene.dialogue = dlgText ? dlgText.split('\n').filter(l => l.trim()).map(line => {
    const idx = line.indexOf(':');
    if (idx === -1) return { speaker: 'unknown', line: line.trim() };
    return { speaker: line.substring(0, idx).trim(), line: line.substring(idx + 1).trim() };
  }) : [];

  try {
    await api(`/api/projects/${currentProjectId}/script`, { method: 'PUT', body: JSON.stringify(currentScript) });
    await refresh();
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
}

function storyboardTierHint(sb) {
  const tier = sb.duration_tier;
  const plan = (currentPreflight && currentPreflight.video) || null;
  const rows = [];
  if (tier && tier.min_sec > 1) {
    const span = tier.max_sec ? `${tier.min_sec}~${tier.max_sec}s` : `≥${tier.min_sec}s`;
    rows.push(`视频档位 ${esc(span)}（${tier.source === 'provider' ? '来自模型' : '来自配置'}）：
      每个镜头都不短于最短计费时长，所以不会出现「买 ${tier.min_sec} 秒只剪 3 秒」`);
  } else if (sb.shots && sb.shots.length) {
    rows.push('当前视频 provider 没有最短时长档位（mock 按真实秒数），分镜不受档位约束');
  }
  if (plan && plan.shots_total) {
    rows.push(`本片 ${plan.shots_total} 个镜头 · 预计计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ ${usd(plan.estimated_usd)}` +
      (plan.merge_plan && plan.merge_plan.worth_it
        ? `；还可以合并短镜头省 ≈ ${usd(plan.merge_plan.saving_usd)}` : ''));
  }
  const warnings = sb.tier_warnings || [];
  const warn = warnings.length
    ? `<br>⚠️ ${warnings.map(esc).join('<br>⚠️ ')}` : '';
  if (!rows.length && !warn) return '';
  return `<div class="hint" style="margin-bottom:8px">${rows.join('<br>')}${warn}</div>`;
}

function toggleShotEdit(si) {
  const elem = $(`shot-edit-${si}`);
  if (elem) elem.classList.toggle('active');
}

async function saveShot(si) {
  if (!currentStoryboard) return;
  const shot = currentStoryboard.shots[si];
  shot.shot_no = parseInt($(`sh-${si}-no`).value) || shot.shot_no;
  shot.duration_sec = parseInt($(`sh-${si}-duration`).value) || shot.duration_sec;
  shot.camera = $(`sh-${si}-camera`).value;
  shot.visual_description = $(`sh-${si}-visual`).value;
  shot.mood = $(`sh-${si}-mood`).value;
  shot.video_prompt = $(`sh-${si}-prompt`).value;
  shot.dialogue_text = $(`sh-${si}-dialogue`).value || null;
  shot.dialogue_speaker = $(`sh-${si}-speaker`).value || null;
  shot.narration = $(`sh-${si}-narration`).value || null;

  try {
    await api(`/api/projects/${currentProjectId}/storyboard`, { method: 'PUT', body: JSON.stringify(currentStoryboard) });
    await refresh();
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
}

async function saveStoryboard() {
  const errEl = $('storyboard-error');
  errEl.textContent = '';
  try {
    const data = JSON.parse($('storyboard-json').value);
    await api(`/api/projects/${currentProjectId}/storyboard`, { method: 'PUT', body: JSON.stringify(data) });
    cancelEdit('storyboard');
    await refresh();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

// ── JSON 编辑器 ─────────────────────────────────────────────────────

function startEdit(kind) {
  const view = $(`${kind}-view`);
  const editor = $(`${kind}-editor`);
  const textarea = $(`${kind}-json`);
  const data = { bible: currentBible, script: currentScript, storyboard: currentStoryboard }[kind];
  if (!data) return;
  textarea.value = JSON.stringify(data, null, 2);
  view.style.display = 'none';
  editor.classList.add('active');
  textarea.focus();
}

function cancelEdit(kind) {
  const view = $(`${kind}-view`);
  const editor = $(`${kind}-editor`);
  const errEl = $(`${kind}-error`);
  view.style.display = '';
  editor.classList.remove('active');
  if (errEl) errEl.textContent = '';
}

// ── 视频片段 ────────────────────────────────────────────────────────

function stopVideoPolling() {
  if (videoPollTimer) { clearTimeout(videoPollTimer); videoPollTimer = null; }
}

function clipStatusLabel(status) {
  return ({ pending: '待生成', generating: '生成中', ready: '就绪', failed: '失败', skipped: '跳过' })[status] || status;
}

function videoHint(status) {
  if (status === 'storyboard_review') return '请先确认分镜，再生成视频片段';
  if (status === 'video_generating') return '正在生成…';
  if (status === 'video_ready') return '片段已就绪，可以生成配音';
  if (v && v.manifest && v.manifest.provider === 'openrouter') {
    return '真实模型按秒计费（最短 5 秒/镜头），预算不足会在提交前被拒绝';
  }
  if (status === 'audio_ready') return '片段已就绪，可以补跑失败镜头或直接合成';
  if (status === 'done') return '已出片；补跑镜头会让成片作废，需要重新合成';
  return '确认分镜后可生成视频片段';
}

function renderVideo() {
  const body = $('video-body');
  const actions = $('video-actions');
  if (!body || !actions) return;

  const v = currentVideo || {};
  const job = v.job;
  const summary = v.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';

  const usedModel = (v.manifest && v.manifest.model) || '';
  $('video-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.ready}/${summary.total} 片段</span>` +
      (usedModel ? `<span class="tag-mini">${esc(usedModel)}</span>` : '') +
      (summary.failed ? `<span class="tag-mini warn">${summary.failed} 失败</span>` : '') +
      (summary.placeholder ? `<span class="tag-mini warn">${summary.placeholder} 占位</span>` : '') +
      (summary.usable ? '<span class="tag-mini ok">可进合成</span>' : '')
    : '';

  const clips = (v.manifest && v.manifest.clips) || [];
  if (!clips.length) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未生成${
      status === 'storyboard_review' ? '（请先确认分镜）' : ''}</span>`;
  } else {
    const shots = {};
    ((currentStoryboard && currentStoryboard.shots) || []).forEach(s => { shots[s.id] = s; });
    body.innerHTML = `<div class="clip-grid">${clips.map(c => {
      const shot = shots[c.shot_id] || {};
      const playable = c.status === 'ready' && c.media_kind === 'video';
      const statusClass = c.status === 'failed' ? 'warn' : c.status === 'ready' ? 'ok' : '';
      return `
        <div class="clip-card ${c.status === 'ready' ? '' : 'pending'}">
          <div class="clip-head">
            <span class="clip-no">#${shot.shot_no != null ? shot.shot_no : '?'}</span>
            <span class="tag-mini">${esc(c.scene_id || '')}</span>
            <span style="color:var(--text2)">${c.duration_sec}s</span>
            <span class="tag-mini ${statusClass}">${esc(clipStatusLabel(c.status))}</span>
            ${c.media_kind === 'placeholder' ? '<span class="tag-mini warn">占位文件</span>' : ''}
          </div>
          ${playable
            ? `<video controls preload="metadata" src="/api/projects/${currentProjectId}/clips/${encodeURIComponent(c.shot_id)}"></video>`
            : `<div style="font-size:11px;color:var(--text2)">${
                c.media_kind === 'placeholder' ? '未检测到 ffmpeg，仅写了占位文件' : '等待生成…'}</div>`}
          ${c.prompt ? `<div class="clip-prompt">${esc(c.prompt)}</div>` : ''}
          ${c.error ? `<div class="clip-error">${esc(c.error)}</div>` : ''}
        </div>`;
    }).join('')}</div>`;
  }

  const wrap = $('video-progress');
  if (active) {
    wrap.style.display = '';
    $('video-progress-fill').style.width = `${job.percent || 0}%`;
    $('video-progress-text').textContent =
      `${job.message || '生成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canStart = ['storyboard_confirmed', 'video_ready', 'audio_ready', 'done'].includes(status) && !active;
  const buttons = [];
  const planLine = videoPlanLine(status);
  if (planLine) buttons.push(`<div class="hint" style="flex-basis:100%">${planLine}</div>`);
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelVideo()">取消生成</button>');
  }
  if (canStart) {
    const hasClips = summary && (summary.ready || summary.failed);
    const plan = (currentPreflight && currentPreflight.video) || null;
    // 换模型/provider 后旧片段会全部重跑，按钮文案必须说清楚（否则「生成缺失片段」是骗人的）
    const label = plan && plan.regenerate_all ? `重新生成全部 ${plan.to_generate} 个片段`
      : !hasClips ? '生成视频片段'
      : summary.failed ? `重试 ${summary.failed} 个失败镜头`
      : '生成缺失片段';
    buttons.push(`<button class="btn btn-sm" onclick="doGenerateVideo()">${label}</button>`);
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(videoHint(status))}</span>`);
  }
  actions.innerHTML = buttons.join('');

  if (active) scheduleVideoPoll(); else stopVideoPolling();
}

function scheduleVideoPoll() {
  stopVideoPolling();
  videoPollTimer = setTimeout(refreshVideoPanel, 1500);
}

async function refreshVideoPanel() {
  if (!currentProjectId) return;
  const previousJobId = currentVideo && currentVideo.job ? currentVideo.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/video/status`);
  if (!status) return;
  currentVideo = status;

  const job = status.job;
  const active = !!(job && job.is_active);
  renderVideo();

  // 任务刚结束 → 整体刷新，更新项目状态标签
  if (!active && job && job.id === previousJobId) {
    await refresh();
  }
}

// ── 成本前置（preflight）─────────────────────────────────────────────

let currentPreflight = null;

async function loadPreflight(action) {
  if (!currentProjectId) return null;
  currentPreflight = await safeGet(
    `/api/projects/${currentProjectId}/preflight?action=${action || 'all'}&script_mode=${audioScriptMode}`
  );
  return currentPreflight;
}

function videoPlanLine(status) {
  const plan = currentPreflight && currentPreflight.video;
  if (!plan || !plan.shots_total) return '';
  if (status === 'storyboard_review') return '';
  const parts = [
    `本次生成 ${plan.to_generate}/${plan.shots_total} 个片段`,
    `计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ <strong>${usd(plan.estimated_usd)}</strong>`,
    plan.price_source === 'config' ? '（单价取配置）' : '',
  ].filter(Boolean).join(' · ');
  const extra = [];
  if (plan.regenerate_all) extra.push(`⚠️ ${esc(plan.regenerate_reason)}：已就绪的 ${plan.existing_ready} 个片段要全部重跑`);
  if (plan.budget && plan.budget.limited) {
    extra.push(`预算剩余 ${usd(plan.budget.remaining_usd)}` +
      (plan.budget.over_budget ? `（不足，还差 ${usd(plan.budget.shortfall_usd)}，会被拒绝）` : ''));
  }
  const merge = plan.merge_plan;
  if (merge && merge.worth_it) {
    extra.push(`合并短镜头：${merge.from_shots} → ${merge.to_shots} 个可省 ≈ ${usd(merge.saving_usd)}`);
  }
  return parts + (extra.length ? '<br>' + extra.join('<br>') : '');
}

function planConfirmText(plan) {
  const lines = [
    `将生成 ${plan.to_generate} 个片段（共 ${plan.shots_total} 个镜头）`,
    `计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ ${usd(plan.estimated_usd)}`,
  ];
  if (plan.regenerate_all) {
    lines.push(`⚠️ ${plan.regenerate_reason}：已就绪的 ${plan.existing_ready} 个片段会全部重新生成`);
  }
  if (plan.budget && plan.budget.limited) {
    lines.push(`预算 ${usd(plan.budget.budget_usd)} · 已花 ${usd(plan.budget.spent_usd)} · 剩余 ${usd(plan.budget.remaining_usd)}`);
  }
  lines.push('', '确认开始生成吗？');
  return lines.join('\n');
}

function doGenerateVideo() {
  stopVideoPolling();
  withBusy('估算花费...', async () => {
    const pre = await loadPreflight('video');
    const plan = pre && pre.video;
    if (!plan) throw new Error('拿不到成本预估，已取消提交');
    if (plan.budget && plan.budget.over_budget) {
      alert('预算不足，已取消提交：\n\n' + planConfirmText(plan) +
        `\n还差 ${usd(plan.budget.shortfall_usd)}（可改 BUDGET_USD=0 关闭限制）`);
      return;
    }
    // 免费（mock）就不用每次都点确认
    if (plan.estimated_usd > 0 || plan.regenerate_all) {
      if (!confirm(planConfirmText(plan))) return;
    }
    await api(`/api/projects/${currentProjectId}/video/generate`, { method: 'POST' });
  });
}

async function doMergeShots() {
  withBusy('试算合并...', async () => {
    const pre = await loadPreflight('video');
    const saving = pre && pre.video && pre.video.merge_plan ? pre.video.merge_plan.saving_usd : 0;
    const preview = await api(`/api/projects/${currentProjectId}/storyboard/merge-shots`, {
      method: 'POST',
      body: JSON.stringify({ dry_run: true }),
    });
    if (preview.to_shots >= preview.from_shots) {
      alert('没有可以合并的镜头：\n\n' + (preview.warnings || []).join('\n'));
      return;
    }
    const text = [
      `镜头：${preview.from_shots} → ${preview.to_shots} 个（每镜最短 ${preview.min_sec}s）`,
      `总时长：${preview.from_seconds}s → ${preview.to_seconds}s`,
      saving > 0 ? `视频计费预计省 ≈ ${usd(saving)}` : '',
      preview.dropped_lines && preview.dropped_lines.length
        ? `⚠️ 会丢掉 ${preview.dropped_lines.length} 条旁白（对白一条都不会丢）` : '',
      preview.force_required
        ? `⚠️ 已有 ${preview.ready_clips} 个可用片段，合并会让它们作废（重新生成要再花钱）` : '',
      '', '确认合并吗？（合并后镜头变少，无法自动还原）',
    ].filter(Boolean).join('\n');
    if (!confirm(text)) return;
    await api(`/api/projects/${currentProjectId}/storyboard/merge-shots`, {
      method: 'POST',
      body: JSON.stringify({
        dry_run: false,
        min_sec: preview.min_sec,
        force: !!preview.force_required,
      }),
    });
  });
}

function doCancelVideo() {
  withBusy('取消生成...', () =>
    api(`/api/projects/${currentProjectId}/video/cancel`, { method: 'POST' }));
}

// ── 配音 ────────────────────────────────────────────────────────────

const EDGE_VOICES = [
  ['zh-CN-XiaoxiaoNeural', '晓晓 · 女声'],
  ['zh-CN-XiaoyiNeural', '晓伊 · 女声'],
  ['zh-CN-YunxiNeural', '云希 · 男声'],
  ['zh-CN-YunjianNeural', '云健 · 男声（旁白）'],
  ['zh-CN-YunyangNeural', '云扬 · 男声（播报）'],
  ['zh-CN-YunxiaNeural', '云夏 · 少年'],
  ['zh-CN-liaoning-XiaobeiNeural', '晓北 · 东北女声'],
  ['zh-CN-shaanxi-XiaoniNeural', '晓妮 · 陕西女声'],
];

function stopAudioPolling() {
  if (audioPollTimer) { clearTimeout(audioPollTimer); audioPollTimer = null; }
}

function speakerLabel(clip) {
  if (clip.speaker_name) return clip.speaker_name;
  if (clip.speaker === 'narrator') return '旁白';
  return clip.speaker || '未知';
}

function audioHint(status) {
  if (status === 'storyboard_confirmed') return '请先生成视频片段，再生成配音';
  if (status === 'video_generating') return '视频片段生成中，稍后可生成配音';
  if (status === 'audio_generating') return '正在合成配音…';
  if (status === 'audio_ready') return '配音已就绪，可以合成成片';
  if (status === 'composing') return '正在合成成片…';
  if (status === 'done') return '已出片；换音色后需要重新合成';
  return '视频片段就绪后可生成配音（Edge-TTS，需要联网）';
}

function currentVoiceOverrides() {
  const overrides = {};
  document.querySelectorAll('#audio-voices select[data-speaker]').forEach(sel => {
    const speaker = sel.getAttribute('data-speaker');
    const base = (currentAudio && currentAudio.voice_map) || {};
    if (base[speaker] && base[speaker] !== sel.value) overrides[speaker] = sel.value;
  });
  return overrides;
}

// 配音文案（LLM 看画面写/改台词）—— 前端记住选择，不做本地持久化
const SCRIPT_MODES = [
  ['off', '只用分镜原文案'],
  ['narration', '补旁白（只给没台词的镜头写）'],
  ['polish', '改写已有台词/旁白'],
  ['full', '补旁白 + 改写 + 念法建议'],
];
let audioScriptMode = 'off';
let audioScriptVision = true;
let audioScriptForce = false;

function onScriptModeChange() {
  const sel = $('audio-script-mode');
  audioScriptMode = sel ? sel.value : 'off';
  renderAudioScript();
}

function onScriptFlagChange() {
  const vision = $('audio-script-vision');
  const force = $('audio-script-force');
  audioScriptVision = !!(vision && vision.checked);
  audioScriptForce = !!(force && force.checked);
}

function renderAudioScript() {
  const box = $('audio-script');
  if (!box) return;
  const options = SCRIPT_MODES
    .map(([value, label]) => `<option value="${value}"${value === audioScriptMode ? ' selected' : ''}>${esc(label)}</option>`)
    .join('');
  box.innerHTML = `
    <label>配音文案
      <select id="audio-script-mode" onchange="onScriptModeChange()">${options}</select>
    </label>
    ${audioScriptMode === 'off' ? '' : `
      <label class="check"><input type="checkbox" id="audio-script-vision"${audioScriptVision ? ' checked' : ''} onchange="onScriptFlagChange()"> 把视频抽帧发给模型（对得上画面，稍贵）</label>
      <label class="check"><input type="checkbox" id="audio-script-force"${audioScriptForce ? ' checked' : ''} onchange="onScriptFlagChange()"> 强制重跑已生成的文案</label>
      <div class="hint">会额外花 LLM 额度；同一模式重跑默认跳过已经写过的镜头。</div>
    `}
  `;
}

function onVoiceChange() {
  renderAudio();
}

function renderAudio() {
  const body = $('audio-body');
  const actions = $('audio-actions');
  if (!body || !actions) return;

  const a = currentAudio || {};
  const job = a.job;
  const summary = a.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';
  const clips = (a.manifest && a.manifest.clips) || [];

  $('audio-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.ready}/${summary.total} 条</span>` +
      (summary.failed ? `<span class="tag-mini warn">${summary.failed} 失败</span>` : '') +
      (summary.placeholder ? `<span class="tag-mini warn">${summary.placeholder} 占位</span>` : '') +
      (summary.bgm ? `<span class="tag-mini ok">BGM: ${esc(summary.bgm)}</span>` : '') +
      (summary.script_lines ? `<span class="tag-mini ok">LLM 文案 ${summary.script_lines}</span>` : '') +
      (summary.usable ? '<span class="tag-mini ok">可进合成</span>' : '')
    : '';

  if (!clips.length) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未生成</span>`;
  } else {
    const voiceMap = a.voice_map || {};
    const speakers = [];
    clips.forEach(c => { if (c.speaker && !speakers.includes(c.speaker)) speakers.push(c.speaker); });
    const voiceRows = speakers.map(sp => {
      const sample = clips.find(c => c.speaker === sp) || {};
      const value = voiceMap[sp] || sample.voice || '';
      const known = EDGE_VOICES.some(v => v[0] === value);
      const options = EDGE_VOICES
        .map(([id, label]) => `<option value="${id}"${id === value ? ' selected' : ''}>${esc(label)}</option>`)
        .join('') + (known || !value ? '' : `<option value="${esc(value)}" selected>${esc(value)}（当前）</option>`);
      return `<div class="voice-row">
        <span class="voice-name">${esc(speakerLabel(sample))}</span>
        <select data-speaker="${esc(sp)}" onchange="onVoiceChange()">${options}</select>
      </div>`;
    }).join('');

    body.innerHTML = `
      <div class="voice-map" id="audio-voices">${voiceRows}</div>
      <div class="clip-grid">${clips.map(c => {
        const playable = c.status === 'ready' && c.media_kind === 'audio';
        const statusClass = c.status === 'failed' ? 'warn' : c.status === 'ready' ? 'ok' : '';
        const delivery = [c.rate, c.volume, c.pitch].filter(Boolean).join(' / ');
        return `
          <div class="clip-card ${c.status === 'ready' ? '' : 'pending'}">
            <div class="clip-head">
              <span class="clip-no">${esc(speakerLabel(c))}</span>
              <span class="tag-mini">${esc(c.kind === 'narration' ? '旁白' : '对白')}</span>
              ${c.script_source ? `<span class="tag-mini ok">LLM 文案</span>` : ''}
              <span style="color:var(--text2)">${(c.duration_sec || 0).toFixed(2)}s</span>
              <span class="tag-mini ${statusClass}">${esc(clipStatusLabel(c.status))}</span>
            </div>
            <div class="clip-prompt">${esc(c.text || '')}</div>
            ${delivery ? `<div class="hint">念法：${esc(delivery)}</div>` : ''}
            ${c.note ? `<div class="hint">${esc(c.note)}</div>` : ''}
            ${playable
              ? `<audio controls preload="none" src="/api/projects/${currentProjectId}/audio/${encodeURIComponent(c.id)}"></audio>`
              : ''}
            ${c.error ? `<div class="clip-error">${esc(c.error)}</div>` : ''}
          </div>`;
      }).join('')}</div>
      ${(a.manifest && a.manifest.warnings && a.manifest.warnings.length)
        ? `<div class="hint" style="margin-top:8px">${a.manifest.warnings.map(esc).join('<br>')}</div>` : ''}
      ${(a.manifest && a.manifest.adjustments && a.manifest.adjustments.length)
        ? `<div class="hint" style="margin-top:8px">音画对齐：${a.manifest.adjustments.length} 个镜头按配音拉长（合成时冻结末帧补足，不重新生成视频）</div>` : ''}
    `;
  }

  const wrap = $('audio-progress');
  if (active) {
    wrap.style.display = '';
    $('audio-progress-fill').style.width = `${job.percent || 0}%`;
    $('audio-progress-text').textContent =
      `${job.message || '生成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canStart = ['video_ready', 'audio_ready', 'done'].includes(status) && !active;
  const changed = Object.keys(currentVoiceOverrides()).length > 0;
  const buttons = [];
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelAudio()">取消配音</button>');
  }
  if (canStart) {
    const label = changed ? '应用音色并重新生成'
      : summary && summary.failed ? `重试 ${summary.failed} 条失败配音`
      : audioScriptMode !== 'off' ? '生成配音 + LLM 文案'
      : clips.length ? '补跑缺失配音' : '生成配音';
    buttons.push(`<button class="btn btn-sm" onclick="doGenerateAudio()">${label}</button>`);
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(audioHint(status))}</span>`);
  }
  actions.innerHTML = buttons.join('');
  renderAudioScript();

  if (active) scheduleAudioPoll(); else stopAudioPolling();
}

function scheduleAudioPoll() {
  stopAudioPolling();
  audioPollTimer = setTimeout(refreshAudioPanel, 1500);
}

async function refreshAudioPanel() {
  if (!currentProjectId) return;
  const previousJobId = currentAudio && currentAudio.job ? currentAudio.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/audio/status`);
  if (!status) return;

// ── 成片合成 ────────────────────────────────────────────────────────

function stopComposePolling() {
  if (composePollTimer) { clearTimeout(composePollTimer); composePollTimer = null; }
}

function composeHint(status) {
  if (status === 'video_ready') return '请先生成配音，再合成成片';
  if (status === 'audio_generating') return '配音生成中…';
  if (status === 'composing') return '正在合成（分段渲染 → 拼接 → 混音 → 字幕）…';
  if (status === 'done') return '成片已就绪；改参数后可以重新合成';
  return '配音就绪后可合成成片（需要 ffmpeg）';
}

function renderCompose() {
  const body = $('compose-body');
  const actions = $('compose-actions');
  const options = $('compose-options');
  if (!body || !actions || !options) return;

  const c = currentCompose || {};
  const job = c.job;
  const report = c.report;
  const summary = c.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';

  $('compose-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.segments} 段 / ${summary.duration_sec}s</span>` +
      `<span class="tag-mini">字幕: ${esc(summary.subtitle_mode)}</span>` +
      (summary.bgm ? `<span class="tag-mini ok">BGM: ${esc(summary.bgm)}</span>` : '') +
      (summary.warnings ? `<span class="tag-mini warn">${summary.warnings} 条提示</span>` : '')
    : '';

  if (!report) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未合成</span>`;
  } else {
    const trackSrc = report.subtitles_path
      ? `<track id="compose-track" kind="subtitles" srclang="zh" label="中文" default
               src="/api/projects/${currentProjectId}/subtitles.vtt">`
      : '';
    body.innerHTML = `
      <video id="compose-video" controls preload="metadata"
             style="width:100%;max-width:320px;border-radius:8px;background:#000"
             src="/api/projects/${currentProjectId}/final">${trackSrc}</video>
      <div class="panel-actions">
        <a class="btn btn-sm" href="/api/projects/${currentProjectId}/final" download>下载成片 MP4</a>
        ${report.subtitles_path
          ? `<a class="btn btn-sm btn-outline" href="/api/projects/${currentProjectId}/subtitles" download>下载字幕 SRT</a>` : ''}
      </div>
      ${report.subtitles_path ? `
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px">
        <input type="checkbox" id="compose-subtitle-preview" checked /> 预览字幕（VTT 叠加）
      </label>` : ''}
      <div class="hint" style="margin-top:8px">
        时长 ${report.duration_sec}s · 字幕模式 ${esc(report.subtitle_mode_effective || report.subtitle_mode)}
        · 环境音 ${esc(report.ambient_mode_effective || 'off')}
        ${report.bgm_id ? ` · BGM ${esc(report.bgm_id)}（${report.bgm_gain_db}dB）` : ' · 无 BGM'}
        · 视频 ${esc(report.video_provider)} / 配音 ${esc(report.tts_provider)}
      </div>
      ${report.subtitle_mode_effective === 'soft'
        ? `<div class="hint" style="margin-top:8px">软字幕（mov_text）只有部分桌面播放器认；
           要在手机/网页里都能看见，选 burn 重新合成一次。</div>` : ''}
      ${(report.warnings && report.warnings.length)
        ? `<div class="hint" style="margin-top:8px">${report.warnings.map(esc).join('<br>')}</div>` : ''}
    `;
    const track = $('compose-track');
    const toggle = $('compose-subtitle-preview');
    if (track && toggle) {
      const apply = () => {
        try { track.track.mode = toggle.checked ? 'showing' : 'hidden'; } catch (e) { /* 轨道还没加载完 */ }
      };
      toggle.onchange = apply;
      track.addEventListener('load', apply);
      apply();
    }
  }

  const burnHint = !serverHealth || serverHealth.ffmpeg_can_burn_subtitles
    ? '需 libass'
    : (serverHealth.ffmpeg_auto_upgrade
        ? '当前主 ffmpeg 无 libass，会自动换用带 libass 的版本'
        : '当前 ffmpeg 无 libass，会降级为软字幕');
  options.innerHTML = `
    <label>字幕模式
      <select id="compose-subtitle-mode">
        <option value="soft">soft · mp4 内嵌字幕轨（部分播放器不显示）</option>
        <option value="burn">burn · 烧进画面（${esc(burnHint)}）</option>
        <option value="none">none · 只导出 srt / vtt</option>
      </select>
    </label>
    <div class="row">
      <label>BGM 曲目 id（留空=按情绪自动选）
        <input id="compose-bgm-id" placeholder="tense_01" />
      </label>
      <label>BGM 音量 dB
        <input id="compose-bgm-gain" type="number" min="-40" max="0" step="1" value="-20" />
      </label>
    </div>
    <div class="row">
      <label>环境音（模型自带音轨）
        <select id="compose-ambient">
          <option value="off">off · 丢弃（人声最干净）</option>
          <option value="under">under · 压低垫在人声下面</option>
        </select>
      </label>
      <label>环境音音量 dB
        <input id="compose-ambient-gain" type="number" min="-40" max="0" step="1" value="-20" />
      </label>
    </div>
  `;
  const modeSel = $('compose-subtitle-mode');
  if (modeSel) modeSel.value = (report && report.subtitle_mode) || 'soft';
  const bgmInput = $('compose-bgm-id');
  if (bgmInput && report && report.bgm_id) bgmInput.value = report.bgm_id;
  const ambientSel = $('compose-ambient');
  if (ambientSel) ambientSel.value = (report && report.ambient_mode) || 'off';
  const ambientGain = $('compose-ambient-gain');
  if (ambientGain && report && report.ambient_gain_db) ambientGain.value = report.ambient_gain_db;

  const wrap = $('compose-progress');
  if (active) {
    wrap.style.display = '';
    $('compose-progress-fill').style.width = `${job.percent || 0}%`;
    $('compose-progress-text').textContent =
      `${job.message || '合成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canCompose = ['audio_ready', 'done'].includes(status) && !active;
  const buttons = [];
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelCompose()">取消合成</button>');
  }
  if (canCompose) {
    const ready = currentVideo && currentVideo.summary && currentVideo.summary.usable;
    buttons.push(`<button class="btn btn-sm btn-green" onclick="doCompose()"${ready ? '' : ' disabled'}>${
      report ? '重新合成成片' : '合成成片'}</button>`);
    if (!ready) buttons.push('<span class="hint">视频片段不完整（含失败/占位），无法合成</span>');
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(composeHint(status))}</span>`);
  }
  if (!c.ffmpeg_available) {
    buttons.push('<span class="hint" style="color:var(--red)">未检测到 ffmpeg，无法合成</span>');
  }
  actions.innerHTML = buttons.join('');

  if (active) scheduleComposePoll(); else stopComposePolling();
}

function scheduleComposePoll() {
  stopComposePolling();
  composePollTimer = setTimeout(refreshComposePanel, 1500);
}

async function refreshComposePanel() {
  if (!currentProjectId) return;
  const previousJobId = currentCompose && currentCompose.job ? currentCompose.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/compose/status`);
  if (!status) return;
  currentCompose = status;

  const job = status.job;
  const active = !!(job && job.is_active);
  renderCompose();
  if (!active && job && job.id === previousJobId) await refresh();
}

function doCompose() {
  const mode = $('compose-subtitle-mode') ? $('compose-subtitle-mode').value : 'soft';
  const bgmId = $('compose-bgm-id') ? $('compose-bgm-id').value.trim() : '';
  const gainRaw = $('compose-bgm-gain') ? $('compose-bgm-gain').value : '';
  const ambientMode = $('compose-ambient') ? $('compose-ambient').value : 'off';
  const ambientGainRaw = $('compose-ambient-gain') ? $('compose-ambient-gain').value : '';
  const body = { subtitle_mode: mode, ambient_mode: ambientMode };
  if (bgmId) body.bgm_id = bgmId;
  if (gainRaw !== '') body.bgm_gain_db = Number(gainRaw);
  if (ambientGainRaw !== '') body.ambient_gain_db = Number(ambientGainRaw);
  stopComposePolling();
  withBusy('提交合成任务...', () =>
    api(`/api/projects/${currentProjectId}/compose`, {
      method: 'POST',
      body: JSON.stringify(body),
    }));
}

function doCancelCompose() {
  withBusy('取消合成...', () =>
    api(`/api/projects/${currentProjectId}/compose/cancel`, { method: 'POST' }));
}

function usd(v) { return `$${(Number(v) || 0).toFixed(4)}`; }

const STAGE_LABEL = {
  bible: '故事圣经', script: '剧本', storyboard: '分镜', image: '角色图',
  video: '视频片段', audio: '配音', compose: '合成', other: '其它',
};

function renderCost() {
  const body = $('cost-body');
  if (!body) return;
  const cost = currentCost || {};
  const summary = cost.summary || {};
  const stages = cost.stages || {};
  const rows = Object.keys(stages).sort();

  const mismatch = (cost.video_unrecorded_usd || 0) > 0;
  $('cost-tags').innerHTML = summary.entries
    ? `<span class="tag-mini ${mismatch ? 'warn' : ''}">${usd(summary.total_usd)}</span>` +
      (mismatch ? `<span class="tag-mini warn">漏记 ${usd(cost.video_unrecorded_usd)}</span>` : '') +
      `<span class="tag-mini">${summary.total_tokens || 0} tokens</span>` +
      (summary.budget_usd > 0
        ? `<span class="tag-mini ${summary.over_budget ? 'warn' : 'ok'}">预算 ${usd(summary.budget_usd)}（剩余 ${usd(summary.remaining_usd)}）</span>`
        : '<span class="tag-mini">未设预算</span>')
    : '';

  if (!summary.entries) {
    body.innerHTML = '<span style="color:var(--text2);font-size:12px">还没有产生花费</span>';
    return;
  }

  const table = rows.map(stage => {
    const row = stages[stage];
    return `<tr>
      <td>${esc(STAGE_LABEL[stage] || stage)}</td>
      <td>${usd(row.usd)}</td>
      <td>${row.tokens || 0}</td>
      <td>${row.units ? row.units.toFixed(1) : '-'}</td>
      <td>${row.calls || 0}</td>
    </tr>`;
  }).join('');

  const est = cost.estimate || {};
  const pre = currentPreflight;
  const upcoming = pre
    ? `<div class="hint" style="margin-top:8px">
         <strong>下一次操作预估</strong>（成本前置 preflight）：
         视频 ${pre.video ? usd(pre.video.estimated_usd) : '—'}（${pre.video ? pre.video.billed_seconds + 's × $' + pre.video.price_per_second : '—'}）·
         配音 ${pre.audio ? usd(pre.audio.estimated_usd) : '—'}${pre.audio && pre.audio.script_usd ? `（含 LLM 文案 ${usd(pre.audio.script_usd)}）` : ''} ·
         合成 ${pre.compose ? usd(pre.compose.estimated_usd) : '—'}
         ${pre.budget && pre.budget.limited
           ? `<br>预算 ${usd(pre.budget.budget_usd)} · 已花 ${usd(pre.budget.spent_usd)} · 本次后剩余 ${usd(pre.budget.budget_usd - pre.budget.projected_usd)}`
           : '<br>未设预算上限（BUDGET_USD=0）'}
       </div>`
    : '';
  body.innerHTML = `
    <table class="cost-table">
      <thead><tr><th>阶段</th><th>花费</th><th>tokens</th><th>秒/字符</th><th>次数</th></tr></thead>
      <tbody>${table}</tbody>
      <tfoot><tr><th>合计</th><th>${usd(summary.total_usd)}</th><th>${summary.total_tokens || 0}</th><th colspan="2"></th></tr></tfoot>
    </table>
    <div class="hint" style="margin-top:8px">
      单价：LLM 输入 $${cost.prices.llm_input_per_mtok}/Mtok · 输出 $${cost.prices.llm_output_per_mtok}/Mtok ·
      视频 $${cost.prices.video_per_second}/秒 · 配音 $${cost.prices.tts_per_mchar}/百万字
      <br>按当前分镜预估：视频 ${usd(est.video_usd)} · 配音 ${usd(est.audio_usd)}（真实单价请在 .env 配）
    </div>
    ${upcoming}
    ${mismatch ? `<div class="hint" style="margin-top:8px;color:var(--warn)">
        ⚠️ 视频片段实测花费 ${usd(cost.video_actual_usd)}，账本只记了 ${usd(cost.video_ledger_usd)}：
        有 ${usd(cost.video_unrecorded_usd)} 没入账（老版本漏记的 bug）。
        <button class="btn btn-sm btn-outline" onclick="doReconcileCost()">补齐视频记账</button>
      </div>` : ''}
  `;
}

function readFileBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      resolve(result.substring(result.indexOf(',') + 1));
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

async function uploadReference(charId, input) {
  const file = input.files && input.files[0];

    await api(`/api/projects/${currentProjectId}/characters/${encodeURIComponent(charId)}/reference`, {
      method: 'POST',
      body: JSON.stringify({ filename: file.name, content_base64 }),
    });
  });
}

  pending: '等待', running: '进行中', succeeded: '完成', failed: '失败', cancelled: '已取消',

function stopBatchPolling() {

function renderBatch() {
  const body = $('batch-body');
  if (!body) return;
  const batch = currentBatch;
  const active = !!(batch && batch.is_active);

  const tags = $('batch-tags');
  if (tags) {
    tags.innerHTML = batch
      ? `<span class="tag-mini">${batch.summary.succeeded}/${batch.summary.total} 完成</span>` +
        (batch.summary.failed ? `<span class="tag-mini warn">${batch.summary.failed} 失败</span>` : '') +
        `<span class="tag-mini ${active ? '' : 'ok'}">${esc(batch.status)}</span>`
      : '';
  }

  const cancelBtn = $('btn-batch-cancel');
  const startBtn = $('btn-batch');
  if (cancelBtn) cancelBtn.style.display = active ? '' : 'none';
  if (startBtn) startBtn.disabled = active;

  if (!batch) { body.innerHTML = ''; return; }

  body.innerHTML = `
    <div class="progress-wrap" style="display:block">
      <div class="progress-bar"><div class="progress-fill" style="width:${batch.percent}%"></div></div>
      <div class="progress-text">${esc(batch.message || batch.status)}（${batch.percent}%，批量 ${batch.id}）</div>

          <td>${item.index + 1}</td>
          <td>${esc(item.title)}</td>

          <td>${esc(item.stage || '-')}</td>
          <td>${item.project_id
            ? `<a href="#" onclick="selectProject('${item.project_id}');return false;">${esc(item.project_id)}</a>`
            : '-'}</td>
        </tr>
        ${item.error ? `<tr><td></td><td colspan="4" class="clip-error">${esc(item.error)}</td></tr>` : ''}
      `).join('')}</tbody>

  if (active) scheduleBatchPoll(); else stopBatchPolling();

function scheduleBatchPoll() {

async function refreshBatch() {

  currentBatch = data;

function doStartBatch() {
  const lines = ($('batch-items').value || '')
    .split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) { alert('请至少填一个主题（每行一个）'); return; }
  const payload = {
    items: lines.map(text => ({ input_text: text })),
    target_duration_sec: Number($('batch-duration').value || 45),
    stop_after: $('batch-stop').value,
    audio_script_mode: ($('batch-script-mode') && $('batch-script-mode').value) || '',
    concurrency: Number($('batch-concurrency').value || 1),
    model: currentModel(),
    aspect_ratio: (currentProject && currentProject.aspect_ratio) || '9:16',
  };
  withBusy('提交批量任务...', async () => {
    currentBatch = await api('/api/batches', { method: 'POST', body: JSON.stringify(payload) });
    renderBatch();
  });
}

function doCancelBatch() {
  if (!currentBatch) return;
  withBusy('取消批量任务...', () =>
    api(`/api/batches/${currentBatch.id}/cancel`, { method: 'POST' }));

function doConfirmStoryboard() {
  withBusy('确认分镜...', () =>
    api(`/api/projects/${currentProjectId}/storyboard/confirm`, { method: 'POST' }));
}

function doReopenStoryboard() {
  withBusy('退回分镜阶段...', () =>
    api(`/api/projects/${currentProjectId}/storyboard/reopen`, { method: 'POST' }));
}

// ── 初始化 ──────────────────────────────────────────────────────────

loadHealth();
loadProjects();
</script>
</body>

  ['zh-CN-YunxiaNeural', '云夏 · 少年'],
  ['zh-CN-liaoning-XiaobeiNeural', '晓北 · 东北女声'],
  ['zh-CN-shaanxi-XiaoniNeural', '晓妮 · 陕西女声'],
];

function applyVoiceCatalog(voices, cloudVoices, provider) {
  if (Array.isArray(voices) && voices.length) {
    EDGE_VOICES = voices.map(v => [v.id, v.label]);
  }
  if (Array.isArray(cloudVoices) && cloudVoices.length) {
    CLOUD_VOICES = cloudVoices.map(v => [v.id, v.label]);
  }
  if (provider) TTS_PROVIDER = provider;
}

//: 当前生效的音色表：云端 TTS 与 Edge 的音色名完全不通用
function activeVoices() {
  return TTS_PROVIDER === 'openrouter' ? CLOUD_VOICES : EDGE_VOICES;
}

function stopAudioPolling() {
  if (audioPollTimer) { clearTimeout(audioPollTimer); audioPollTimer = null; }
}

function speakerLabel(clip) {
  if (clip.speaker_name) return clip.speaker_name;
  if (clip.speaker === 'narrator') return '旁白';
  return clip.speaker ? speakerName(clip.speaker) : '未知';
}

function audioHint(status) {
  if (status === 'storyboard_confirmed') return '请先生成视频片段，再生成配音';
  if (status === 'video_generating') return '视频片段生成中，稍后可生成配音';
  if (status === 'audio_generating') return '正在合成配音…';
  if (status === 'audio_ready') return '配音已就绪，可以合成成片';
  if (status === 'composing') return '正在合成成片…';
  if (status === 'done') return '已出片；换音色后需要重新合成';
  return '视频片段就绪后可生成配音（Edge-TTS，需要联网）';
}

function currentVoiceOverrides() {
  const overrides = {};
  document.querySelectorAll('#audio-voices select[data-speaker]').forEach(sel => {
    const speaker = sel.getAttribute('data-speaker');
    const base = (currentAudio && currentAudio.voice_map) || {};
    if (base[speaker] && base[speaker] !== sel.value) overrides[speaker] = sel.value;
  });
  return overrides;
}

// 配音文案（LLM 看画面写/改台词）—— 前端记住选择，不做本地持久化
const SCRIPT_MODES = [
  ['off', '只用分镜原文案'],
  ['narration', '补旁白（只给没台词的镜头写）'],
  ['polish', '改写已有台词/旁白'],
  ['full', '补旁白 + 改写 + 念法建议'],
];
let audioScriptMode = 'off';
let audioScriptVision = true;
let audioScriptForce = false;

function onScriptModeChange() {
  const sel = $('audio-script-mode');
  audioScriptMode = sel ? sel.value : 'off';
  renderAudioScript();
}

function onScriptFlagChange() {
  const vision = $('audio-script-vision');
  const force = $('audio-script-force');
  audioScriptVision = !!(vision && vision.checked);
  audioScriptForce = !!(force && force.checked);
}

function renderAudioScript() {
  const box = $('audio-script');
  if (!box) return;
  const options = SCRIPT_MODES
    .map(([value, label]) => `<option value="${value}"${value === audioScriptMode ? ' selected' : ''}>${esc(label)}</option>`)
    .join('');
  box.innerHTML = `
    <label>配音文案
      <select id="audio-script-mode" onchange="onScriptModeChange()">${options}</select>
    </label>
    ${audioScriptMode === 'off' ? '' : `
      <label class="check"><input type="checkbox" id="audio-script-vision"${audioScriptVision ? ' checked' : ''} onchange="onScriptFlagChange()"> 把视频抽帧发给模型（对得上画面，稍贵）</label>
      <label class="check"><input type="checkbox" id="audio-script-force"${audioScriptForce ? ' checked' : ''} onchange="onScriptFlagChange()"> 强制重跑已生成的文案</label>
      <div class="hint">会额外花 LLM 额度；同一模式重跑默认跳过已经写过的镜头。</div>
    `}
  `;
}

function onVoiceChange() {
  renderAudio();
}

function renderAudio() {
  const body = $('audio-body');
  const actions = $('audio-actions');
  if (!body || !actions) return;

  const a = currentAudio || {};
  const job = a.job;
  const summary = a.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';
  const clips = (a.manifest && a.manifest.clips) || [];

  $('audio-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.ready}/${summary.total} 条</span>` +
      (summary.failed ? `<span class="tag-mini warn">${summary.failed} 失败</span>` : '') +
      (summary.placeholder ? `<span class="tag-mini warn">${summary.placeholder} 占位</span>` : '') +
      (summary.bgm ? `<span class="tag-mini ok">BGM: ${esc(summary.bgm)}</span>` : '') +
      (summary.script_lines ? `<span class="tag-mini ok">LLM 文案 ${summary.script_lines}</span>` : '') +
      (summary.usable ? '<span class="tag-mini ok">可进合成</span>' : '')
    : '';

  if (!clips.length) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未生成</span>`;
  } else {
    const voiceMap = a.voice_map || {};
    const speakers = [];
    clips.forEach(c => { if (c.speaker && !speakers.includes(c.speaker)) speakers.push(c.speaker); });
    const voiceRows = speakers.map(sp => {
      const sample = clips.find(c => c.speaker === sp) || {};
      const value = voiceMap[sp] || sample.voice || '';
      const known = activeVoices().some(v => v[0] === value);
      const options = activeVoices()
        .map(([id, label]) => `<option value="${id}"${id === value ? ' selected' : ''}>${esc(label)}</option>`)
        .join('') + (known || !value ? '' : `<option value="${esc(value)}" selected>${esc(value)}（当前）</option>`);
      return `<div class="voice-row">
        <span class="voice-name">${esc(speakerLabel(sample))}</span>
        <select data-speaker="${esc(sp)}" onchange="onVoiceChange()">${options}</select>
      </div>`;
    }).join('');

    const castingNotes = (a.warnings || []).filter(w => /选角|音色/.test(w));
    body.innerHTML = `
      <div class="voice-map" id="audio-voices">${voiceRows}</div>
      ${castingNotes.length
        ? `<div class="hint" style="margin-bottom:8px">${castingNotes.map(esc).join('<br>')}</div>`
        : ''}
      <div class="clip-grid">${clips.map(c => {
        const playable = c.status === 'ready' && c.media_kind === 'audio';
        const statusClass = c.status === 'failed' ? 'warn' : c.status === 'ready' ? 'ok' : '';
        const delivery = [c.rate, c.volume, c.pitch].filter(Boolean).join(' / ');
        return `
          <div class="clip-card ${c.status === 'ready' ? '' : 'pending'}">
            <div class="clip-head">
              <span class="clip-no">${esc(speakerLabel(c))}</span>
              <span class="tag-mini">${esc(c.kind === 'narration' ? '旁白' : '对白')}</span>
              ${c.script_source ? `<span class="tag-mini ok">LLM 文案</span>` : ''}
              <span style="color:var(--text2)">${(c.duration_sec || 0).toFixed(2)}s</span>
              <span class="tag-mini ${statusClass}">${esc(clipStatusLabel(c.status))}</span>
            </div>
            <div class="clip-prompt">${esc(c.text || '')}</div>
            ${delivery ? `<div class="hint">念法：${esc(delivery)}</div>` : ''}
            ${c.note ? `<div class="hint">${esc(c.note)}</div>` : ''}
            ${playable
              ? `<audio controls preload="none" src="/api/projects/${currentProjectId}/audio/${encodeURIComponent(c.id)}"></audio>`
              : ''}
            ${c.error ? `<div class="clip-error">${esc(c.error)}</div>` : ''}
          </div>`;
      }).join('')}</div>
      ${(a.manifest && a.manifest.warnings && a.manifest.warnings.length)
        ? `<div class="hint" style="margin-top:8px">${a.manifest.warnings.map(esc).join('<br>')}</div>` : ''}
      ${(a.manifest && a.manifest.adjustments && a.manifest.adjustments.length)
        ? `<div class="hint" style="margin-top:8px">音画对齐：${a.manifest.adjustments.length} 个镜头按配音拉长（合成时冻结末帧补足，不重新生成视频）</div>` : ''}
    `;
  }

  const wrap = $('audio-progress');
  if (active) {
    wrap.style.display = '';
    $('audio-progress-fill').style.width = `${job.percent || 0}%`;
    $('audio-progress-text').textContent =
      `${job.message || '生成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canStart = ['video_ready', 'audio_ready', 'done'].includes(status) && !active;
  const changed = Object.keys(currentVoiceOverrides()).length > 0;
  const buttons = [];
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelAudio()">取消配音</button>');
  }
  if (canStart) {
    const label = changed ? '应用音色并重新生成'
      : summary && summary.failed ? `重试 ${summary.failed} 条失败配音`
      : audioScriptMode !== 'off' ? '生成配音 + LLM 文案'
      : clips.length ? '补跑缺失配音' : '生成配音';
    buttons.push(`<button class="btn btn-sm" onclick="doGenerateAudio()">${label}</button>`);
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(audioHint(status))}</span>`);
  }
  actions.innerHTML = buttons.join('');
  renderAudioScript();

  if (active) scheduleAudioPoll(); else stopAudioPolling();
}

function scheduleAudioPoll() {
  stopAudioPolling();
  audioPollTimer = setTimeout(refreshAudioPanel, 1500);
}

async function refreshAudioPanel() {
  if (!currentProjectId) return;
  const previousJobId = currentAudio && currentAudio.job ? currentAudio.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/audio/status`);
  if (!status) return;
  currentAudio = status;

  const job = status.job;
  const active = !!(job && job.is_active);
  renderAudio();
  if (!active && job && job.id === previousJobId) await refresh();
}

function doGenerateAudio() {
  const voices = currentVoiceOverrides();
  stopAudioPolling();
  withBusy('提交配音任务...', () =>
    api(`/api/projects/${currentProjectId}/audio/generate`, {
      method: 'POST',
      body: JSON.stringify({
        voices,
        script_mode: audioScriptMode,
        use_vision: audioScriptVision,
        force_script: audioScriptForce,
      }),
    }));
}

function doCancelAudio() {
  withBusy('取消配音...', () =>
    api(`/api/projects/${currentProjectId}/audio/cancel`, { method: 'POST' }));
}

// ── 成片合成 ────────────────────────────────────────────────────────

function stopComposePolling() {
  if (composePollTimer) { clearTimeout(composePollTimer); composePollTimer = null; }
}

function composeHint(status) {
  if (status === 'video_ready') return '请先生成配音，再合成成片';
  if (status === 'audio_generating') return '配音生成中…';
  if (status === 'composing') return '正在合成（分段渲染 → 拼接 → 混音 → 字幕）…';
  if (status === 'done') return '成片已就绪；改参数后可以重新合成';
  return '配音就绪后可合成成片（需要 ffmpeg）';
}

function renderCompose() {
  const body = $('compose-body');
  const actions = $('compose-actions');
  const options = $('compose-options');
  if (!body || !actions || !options) return;

  const c = currentCompose || {};
  const job = c.job;
  const report = c.report;
  const summary = c.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';

  $('compose-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.segments} 段 / ${summary.duration_sec}s</span>` +
      `<span class="tag-mini">字幕: ${esc(summary.subtitle_mode)}</span>` +
      (summary.bgm ? `<span class="tag-mini ok">BGM: ${esc(summary.bgm)}</span>` : '') +
      (summary.warnings ? `<span class="tag-mini warn">${summary.warnings} 条提示</span>` : '')
    : '';

  if (!report) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未合成</span>`;
  } else {
    const trackSrc = report.subtitles_path
      ? `<track id="compose-track" kind="subtitles" srclang="zh" label="中文" default
               src="${withToken(`/api/projects/${currentProjectId}/subtitles.vtt`)}">`
      : '';
    body.innerHTML = `
      <video id="compose-video" controls preload="metadata"
             style="width:100%;max-width:320px;border-radius:8px;background:#000"
             src="${withToken(`/api/projects/${currentProjectId}/final`)}">${trackSrc}</video>
      <div class="panel-actions">
        <a class="btn btn-sm" href="${withToken(`/api/projects/${currentProjectId}/final`)}" download>下载成片 MP4</a>
        ${report.subtitles_path
          ? `<a class="btn btn-sm btn-outline" href="${withToken(`/api/projects/${currentProjectId}/subtitles`)}" download>下载字幕 SRT</a>` : ''}
      </div>
      ${report.subtitles_path ? `
      <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-top:6px">
        <input type="checkbox" id="compose-subtitle-preview" checked /> 预览字幕（VTT 叠加）
      </label>` : ''}
      <div class="hint" style="margin-top:8px">
        时长 ${report.duration_sec}s · 字幕模式 ${esc(report.subtitle_mode_effective || report.subtitle_mode)}
        · 环境音 ${esc(report.ambient_mode_effective || 'off')}
        ${report.bgm_id ? ` · BGM ${esc(report.bgm_id)}（${report.bgm_gain_db}dB）` : ' · 无 BGM'}
        · 视频 ${esc(report.video_provider)} / 配音 ${esc(report.tts_provider)}
      </div>
      ${report.subtitle_mode_effective === 'soft'
        ? `<div class="hint" style="margin-top:8px">软字幕（mov_text）只有部分桌面播放器认；
           要在手机/网页里都能看见，选 burn 重新合成一次。</div>` : ''}
      ${(report.warnings && report.warnings.length)
        ? `<div class="hint" style="margin-top:8px">${report.warnings.map(esc).join('<br>')}</div>` : ''}
    `;
    const track = $('compose-track');
    const toggle = $('compose-subtitle-preview');
    if (track && toggle) {
      const apply = () => {
        try { track.track.mode = toggle.checked ? 'showing' : 'hidden'; } catch (e) { /* 轨道还没加载完 */ }
      };
      toggle.onchange = apply;
      track.addEventListener('load', apply);
      apply();
    }
  }

  const burnHint = !serverHealth || serverHealth.ffmpeg_can_burn_subtitles
    ? '需 libass'
    : (serverHealth.ffmpeg_auto_upgrade
        ? '当前主 ffmpeg 无 libass，会自动换用带 libass 的版本'
        : '当前 ffmpeg 无 libass，会降级为软字幕');
  options.innerHTML = `
    <label>字幕模式
      <select id="compose-subtitle-mode">
        <option value="soft">soft · mp4 内嵌字幕轨（部分播放器不显示）</option>
        <option value="burn">burn · 烧进画面（${esc(burnHint)}）</option>
        <option value="none">none · 只导出 srt / vtt</option>
      </select>
    </label>
    <div class="row">
      <label>曲库曲目 id（只对「曲库」引擎有意义，留空=按情绪自动选）
        <input id="compose-bgm-id" placeholder="tense_01" />
      </label>
    </div>
    <div class="row">
      <label>环境音（模型自带音轨）
        <select id="compose-ambient">
          <option value="off">off · 丢弃（人声最干净）</option>
          <option value="under">under · 压低垫在人声下面</option>
        </select>
      </label>
      <label>环境音音量 dB
        <input id="compose-ambient-gain" type="number" min="-40" max="0" step="1" value="-20" />
      </label>
    </div>
  `;
  const modeSel = $('compose-subtitle-mode');
  if (modeSel) modeSel.value = (report && report.subtitle_mode) || 'soft';
  const bgmInput = $('compose-bgm-id');
  if (bgmInput && report && report.bgm_id) bgmInput.value = report.bgm_id;
  const ambientSel = $('compose-ambient');
  if (ambientSel) ambientSel.value = (report && report.ambient_mode) || 'off';
  const ambientGain = $('compose-ambient-gain');
  if (ambientGain && report && report.ambient_gain_db) ambientGain.value = report.ambient_gain_db;

  const wrap = $('compose-progress');
  if (active) {
    wrap.style.display = '';
    $('compose-progress-fill').style.width = `${job.percent || 0}%`;
    $('compose-progress-text').textContent =
      `${job.message || '合成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canCompose = ['audio_ready', 'done'].includes(status) && !active;
  const buttons = [];
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelCompose()">取消合成</button>');
  }
  if (canCompose) {
    const ready = currentVideo && currentVideo.summary && currentVideo.summary.usable;
    buttons.push(`<button class="btn btn-sm btn-green" onclick="doCompose()"${ready ? '' : ' disabled'}>${
      report ? '重新合成成片' : '合成成片'}</button>`);
    if (!ready) buttons.push('<span class="hint">视频片段不完整（含失败/占位），无法合成</span>');
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(composeHint(status))}</span>`);
  }
  if (!c.ffmpeg_available) {
    buttons.push('<span class="hint" style="color:var(--red)">未检测到 ffmpeg，无法合成</span>');
  }
  actions.innerHTML = buttons.join('');

  if (active) scheduleComposePoll(); else stopComposePolling();
}

function scheduleComposePoll() {
  stopComposePolling();
  composePollTimer = setTimeout(refreshComposePanel, 1500);
}

async function refreshComposePanel() {
  if (!currentProjectId) return;
  const previousJobId = currentCompose && currentCompose.job ? currentCompose.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/compose/status`);
  if (!status) return;
  currentCompose = status;

  const job = status.job;
  const active = !!(job && job.is_active);
  renderCompose();
  if (!active && job && job.id === previousJobId) await refresh();
}


// ── 背景音乐 ────────────────────────────────────────────────────────

const MUSIC_ENGINE_LABEL = {
  library: '曲库', generate: '本机现写', cli: '外部模型', auto: '自动', none: '关闭',
};
const MUSIC_MOODS = [
  ['', '自动（按分镜情绪）'],
  ['tense', '紧张 / 悬疑'], ['sad', '悲伤 / 压抑'], ['warm', '温暖 / 日常'],
  ['hopeful', '希望 / 坚定'], ['action', '激烈 / 动作'], ['mystery', '神秘 / 悬念'],
  ['playful', '轻快 / 喜剧'], ['neutral', '中性 / 铺底'],
];
const SECTION_LABEL = {
  intro: '开场', bed: '铺陈', build: '推进', climax: '高潮', resolve: '收束',
};
const LAYER_LABEL = {
  pad: '铺底', piano: '钢琴', bass: '低音', lead: '旋律',
  perc: '鼓组', strings: '弦乐', bells: '点音',
};

function mmss(sec) {
  const total = Math.max(0, Math.round(Number(sec) || 0));
  return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
}

function renderMusic() {
  const body = $('music-body'), options = $('music-options'), actions = $('music-actions');
  const tags = $('music-tags');
  if (!body || !options || !actions) return;

  const m = currentMusic || {};
  const track = m.track || null;
  const plan = m.plan || null;
  const sections = m.sections || [];
  const notes = m.notes || [];
  const accents = m.accents || [];
  const engines = (modelInfo && modelInfo.music_engine_problems) || {};

  tags.innerHTML =
    `<span class="tag-mini ${track ? 'ok' : ''}">${
      track ? esc(MUSIC_ENGINE_LABEL[track.engine] || track.engine) : '未配乐'}</span>` +
    (plan ? `<span class="tag-mini">${esc(plan.color_label || plan.color || '')} · ${
      esc(plan.key_name || '')} · ${plan.bpm}BPM</span>` : '') +
    (sections.length ? `<span class="tag-mini">${sections.length} 段 / ${accents.length} 重音</span>` : '') +
    (m.duck ? '<span class="tag-mini ok">人声闪避</span>' : '') +
    (m.ready === false ? '<span class="tag-mini warn">引擎不可用</span>' : '');

  const engine = track ? (track.engine || 'library') : (m.engine || 'library');
  const gain = (m.gain_db === null || m.gain_db === undefined) ? -20 : m.gain_db;
  const duck = m.duck !== false;
  const mood = (currentProject && currentProject.music_mood) || '';
  const note = (currentProject && currentProject.music_note) || m.note || '';

  if (!track && !plan) {
    body.innerHTML = `<div class="hint">还没有配乐。${
      engine === 'library'
        ? '曲库模式：把音乐放进 BGM_DIR，或把引擎切成「本机现写」。'
        : '点「生成配乐」：本机按分镜现写，$0，不联网。'}</div>`;
  } else {
    const rows = sections.map(sec => `
      <tr>
        <td class="label">${esc(SECTION_LABEL[sec.label] || sec.label)}</td>
        <td>${mmss(sec.start_sec)}–${mmss(sec.end_sec)}</td>
        <td>能量 ${sec.energy}</td>
        <td>${(sec.layers || []).map(x => esc(LAYER_LABEL[x] || x)).join('、') || '—'}</td>
        <td>${(sec.chords || []).map(esc).join(' → ')}</td>
        <td>${sec.dialogue ? '有台词（让路）' : ''}</td>
      </tr>`).join('');
    const accentText = accents.length
      ? accents.slice(0, 6).map(a => `${mmss(a.at_sec)} ${esc(a.reason)}`).join('；') +
        (accents.length > 6 ? `；…共 ${accents.length} 处` : '')
      : '无';
    body.innerHTML = `
      ${m.audio_url ? `<audio controls preload="none" style="width:100%;max-width:420px;margin-bottom:6px"
             src="${withToken(m.audio_url)}"></audio>` : ''}
      <div class="hint">
        ${track ? `${esc(track.title || track.id)} · ${track.duration_sec || '?'}s · 音量 ${gain}dB ·
          ${track.loop === false ? '整片长度不循环' : '循环铺满'} · ${esc(track.license || '')}` : ''}
      </div>
      <table class="music-sections">
        <thead><tr><th>段落</th><th>时间</th><th>能量</th><th>配器</th><th>和弦</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="accents" style="margin-top:6px">重音（对齐镜头切换与画面动作）：${accentText}</div>
      ${notes.length ? `<div class="hint" style="margin-top:6px">${notes.map(esc).join('<br>')}</div>` : ''}
    `;
  }

  options.innerHTML = `
    <div class="row">
      <label>配乐引擎
        <select id="music-engine">
          ${['library', 'generate', 'cli', 'auto', 'none'].map(value => {
            const problem = engines[value];
            const suffix = problem ? `（不可用：${problem}）` : '';
            return `<option value="${value}"${problem ? ' disabled' : ''}>${
              MUSIC_ENGINE_LABEL[value] || value}${esc(suffix)}</option>`;
          }).join('')}
        </select>
      </label>
      <label>情绪色调
        <select id="music-mood">
          ${MUSIC_MOODS.map(([value, label]) =>
            `<option value="${value}">${esc(label)}</option>`).join('')}
        </select>
      </label>
    </div>
    <label>配乐要求（自由文本，会参与情绪判断）
      <input id="music-note" placeholder="压抑一点，结尾要有希望，别太吵" />
    </label>
    <div class="row">
      <label>音乐音量 dB
        <input id="music-gain" type="number" min="-40" max="0" step="1" value="${gain}" />
      </label>
      <label class="check" style="align-self:end">
        <input type="checkbox" id="music-duck"${duck ? ' checked' : ''} /> 人声闪避（说话时压低音乐）
      </label>
    </div>
    <div class="hint">
      生成的是<b>干燥音轨 + 卷积混响 + 响度归一</b>：段落边界对齐镜头切换、
      画面动作最猛处给重音、有人说话的段落去鼓并让旋律避开。
      改完参数点「重新合成」即可听到，不用重跑配音（配乐不花钱）。
    </div>
  `;
  const engineSel = $('music-engine');
  if (engineSel) engineSel.value = engine;
  const moodSel = $('music-mood');
  if (moodSel) moodSel.value = mood;
  const noteInput = $('music-note');
  if (noteInput) noteInput.value = note;

  const status = currentProject ? currentProject.status : '';
  const canCompose = ['audio_ready', 'done'].includes(status);
  const buttons = [];
  buttons.push(`<button class="btn btn-sm" onclick="doGenerateMusic()"${
    canCompose || (currentStoryboard && currentStoryboard.shots) ? '' : ' disabled'}>${
    track || plan ? '重新生成配乐' : '生成配乐'}</button>`);
  if (plan && m.audio_url) {
    buttons.push(`<a class="btn btn-sm btn-outline" href="${withToken(m.audio_url)}" download>下载音乐 WAV</a>`);
  }
  if (plan) {
    buttons.push('<button class="btn btn-sm btn-outline" onclick="doShowMusicPrompt()">看外部模型提示词</button>');
  }
  actions.innerHTML = buttons.join('');
}

async function doGenerateMusic() {
  const engine = $('music-engine') ? $('music-engine').value : 'generate';
  const mood = $('music-mood') ? $('music-mood').value : '';
  const note = $('music-note') ? $('music-note').value.trim() : '';
  const gainRaw = $('music-gain') ? $('music-gain').value : '';
  const duck = $('music-duck') ? $('music-duck').checked : true;
  const body = { engine, mood, note, duck, force: true };
  if (gainRaw !== '') body.gain_db = Number(gainRaw);
  await withBusy('生成配乐（本机合成，$0）...', async () => {
    const result = await api(`/api/projects/${currentProjectId}/music`, {
      method: 'POST', body: JSON.stringify(body),
    });
    // 选择同时写进项目，重跑/重新合成时不会丢
    await api(`/api/projects/${currentProjectId}`, {
      method: 'PUT',
      body: JSON.stringify({
        music_engine: engine, music_mood: mood, music_note: note,
        music_gain_db: gainRaw === '' ? null : Number(gainRaw), music_duck: duck,
      }),
    });
    if (result && result.note) $('global-status').textContent = result.note;
  });
}

async function doShowMusicPrompt() {
  const data = await safeGet(`/api/projects/${currentProjectId}/music/prompt`);
  if (!data || !data.prompt) { alert('还没有配乐谱'); return; }
  const box = $('music-body');
  const old = $('music-prompt');
  if (old) { old.remove(); return; }
  const node = document.createElement('textarea');
  node.id = 'music-prompt';
  node.rows = 4;
  node.style.marginTop = '6px';
  node.value = data.prompt;
  box.appendChild(node);
  node.select();
  try { document.execCommand('copy'); } catch (e) { /* 复制失败就让用户自己选 */ }
}

function doCompose() {
  const mode = $('compose-subtitle-mode') ? $('compose-subtitle-mode').value : 'soft';
  const bgmId = $('compose-bgm-id') ? $('compose-bgm-id').value.trim() : '';
  const gainRaw = $('compose-bgm-gain') ? $('compose-bgm-gain').value : '';
  const ambientMode = $('compose-ambient') ? $('compose-ambient').value : 'off';
  const ambientGainRaw = $('compose-ambient-gain') ? $('compose-ambient-gain').value : '';
  const body = { subtitle_mode: mode, ambient_mode: ambientMode };
  if (bgmId) body.bgm_id = bgmId;
  if (gainRaw !== '') body.bgm_gain_db = Number(gainRaw);
  if (ambientGainRaw !== '') body.ambient_gain_db = Number(ambientGainRaw);
  // 配乐参数一起提交：合成阶段会按引擎决定是用曲库、现写还是外部模型
  if ($('music-engine')) body.bgm_engine = $('music-engine').value;
  if ($('music-mood')) body.bgm_mood = $('music-mood').value;
  if ($('music-note')) body.music_note = $('music-note').value.trim();
  if ($('music-gain') && $('music-gain').value !== '') body.bgm_gain_db = Number($('music-gain').value);
  if ($('music-duck')) body.bgm_duck = $('music-duck').checked;
  stopComposePolling();
  withBusy('提交合成任务...', () =>
    api(`/api/projects/${currentProjectId}/compose`, {
      method: 'POST',
      body: JSON.stringify(body),
    }));
}

function doCancelCompose() {
  withBusy('取消合成...', () =>
    api(`/api/projects/${currentProjectId}/compose/cancel`, { method: 'POST' }));
}

// ── 成本 ────────────────────────────────────────────────────────────

function usd(v) { return `$${(Number(v) || 0).toFixed(4)}`; }

const STAGE_LABEL = {
  bible: '故事圣经', script: '剧本', storyboard: '分镜', image: '角色图',
  video: '视频片段', audio: '配音', compose: '合成', other: '其它',
};

function renderCost() {
  const body = $('cost-body');
  if (!body) return;
  const cost = currentCost || {};
  const summary = cost.summary || {};
  const stages = cost.stages || {};
  const rows = Object.keys(stages).sort();

  const mismatch = (cost.video_unrecorded_usd || 0) > 0;
  $('cost-tags').innerHTML = summary.entries
    ? `<span class="tag-mini ${mismatch ? 'warn' : ''}">${usd(summary.total_usd)}</span>` +
      (mismatch ? `<span class="tag-mini warn">漏记 ${usd(cost.video_unrecorded_usd)}</span>` : '') +
      `<span class="tag-mini">${summary.total_tokens || 0} tokens</span>` +
      (summary.budget_usd > 0
        ? `<span class="tag-mini ${summary.over_budget ? 'warn' : 'ok'}">预算 ${usd(summary.budget_usd)}（剩余 ${usd(summary.remaining_usd)}）</span>`
        : '<span class="tag-mini">未设预算</span>')
    : '';

  if (!summary.entries) {
    body.innerHTML = '<span style="color:var(--text2);font-size:12px">还没有产生花费</span>';
    return;
  }

  const table = rows.map(stage => {
    const row = stages[stage];
    return `<tr>
      <td>${esc(STAGE_LABEL[stage] || stage)}</td>
      <td>${usd(row.usd)}</td>
      <td>${row.tokens || 0}</td>
      <td>${row.units ? row.units.toFixed(1) : '-'}</td>
      <td>${row.calls || 0}</td>
    </tr>`;
  }).join('');

  const est = cost.estimate || {};
  const pre = currentPreflight;
  const upcoming = pre
    ? `<div class="hint" style="margin-top:8px">
         <strong>下一次操作预估</strong>（成本前置 preflight）：
         视频 ${pre.video ? usd(pre.video.estimated_usd) : '—'}（${pre.video ? pre.video.billed_seconds + 's × $' + pre.video.price_per_second : '—'}）·
         配音 ${pre.audio ? usd(pre.audio.estimated_usd) : '—'}${pre.audio && pre.audio.script_usd ? `（含 LLM 文案 ${usd(pre.audio.script_usd)}）` : ''} ·
         合成 ${pre.compose ? usd(pre.compose.estimated_usd) : '—'}
         ${pre.budget && pre.budget.limited
           ? `<br>预算 ${usd(pre.budget.budget_usd)} · 已花 ${usd(pre.budget.spent_usd)} · 本次后剩余 ${usd(pre.budget.budget_usd - pre.budget.projected_usd)}`
           : '<br>未设预算上限（BUDGET_USD=0）'}
       </div>`
    : '';
  body.innerHTML = `
    <table class="cost-table">
      <thead><tr><th>阶段</th><th>花费</th><th>tokens</th><th>秒/字符</th><th>次数</th></tr></thead>
      <tbody>${table}</tbody>
      <tfoot><tr><th>合计</th><th>${usd(summary.total_usd)}</th><th>${summary.total_tokens || 0}</th><th colspan="2"></th></tr></tfoot>
    </table>
    <div class="hint" style="margin-top:8px">
      单价：LLM 输入 $${cost.prices.llm_input_per_mtok}/Mtok · 输出 $${cost.prices.llm_output_per_mtok}/Mtok ·
      视频 $${cost.prices.video_per_second}/秒 · 配音 $${cost.prices.tts_per_mchar}/百万字
      <br>按当前分镜预估：视频 ${usd(est.video_usd)} · 配音 ${usd(est.audio_usd)}（真实单价请在 .env 配）
    </div>
    ${upcoming}
    ${mismatch ? `<div class="hint" style="margin-top:8px;color:var(--warn)">
        ⚠️ 视频片段实测花费 ${usd(cost.video_actual_usd)}，账本只记了 ${usd(cost.video_ledger_usd)}：
        有 ${usd(cost.video_unrecorded_usd)} 没入账（老版本漏记的 bug）。
        <button class="btn btn-sm btn-outline" onclick="doReconcileCost()">补齐视频记账</button>
      </div>` : ''}
  `;
}

function doReconcileCost() {
  withBusy('补齐视频记账...', () =>
    api(`/api/projects/${currentProjectId}/cost/reconcile`, { method: 'POST' }));
}

// ── 模型选择 ────────────────────────────────────────────────────────

function renderModelSelect() {
  const sel = $('project-model');
  if (!sel || !modelInfo) return;
  const current = (currentProject && currentProject.llm_model) || '';
  const options = [`<option value="">默认（${esc(modelInfo.default)}）</option>`]
    .concat(modelInfo.candidates.map(m =>
      `<option value="${esc(m)}"${m === current ? ' selected' : ''}>${esc(m)}</option>`));
  sel.innerHTML = options.join('');
  sel.value = current;
  sel.onchange = onModelChange;
  $('model-hint').textContent = current
    ? '本项目使用指定模型'
    : `默认模型：${modelInfo.default}`;
}

async function onModelChange() {
  const model = $('project-model').value;
  await withBusy('保存模型设置...', () =>
    api(`/api/projects/${currentProjectId}`, {
      method: 'PUT',
      body: JSON.stringify({ llm_model: model }),
    }));
}

function currentModel() {
  const sel = $('project-model');
  return sel ? sel.value : '';
}

// ── 参考图（角色一致性）─────────────────────────────────────────────

function readFileBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = String(reader.result || '');
      resolve(result.substring(result.indexOf(',') + 1));
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

async function refreshReferencePlan() {
  const hint = $('ref-plan-hint');
  if (!hint || !currentProjectId) return;
  try {
    const plan = await api(`/api/projects/${currentProjectId}/characters/references/plan`);
    hint.textContent = plan.missing
      ? `缺 ${plan.missing}/${plan.total} 张 · 补齐约 ${usd(plan.estimated_usd)}（${plan.model}，$${plan.price_per_image}/张）`
      : `参考图齐了（${plan.total}/${plan.total}）`;
  } catch (e) {
    hint.textContent = '';
  }
}

async function generateAllReferences() {
  const plan = await api(`/api/projects/${currentProjectId}/characters/references/plan`);
  if (!plan.missing) { alert('所有角色都已有参考图'); return; }
  if (!confirm(`将为 ${plan.missing} 个缺失角色生成参考图，预计 ${usd(plan.estimated_usd)}，继续？`)) return;
  await withBusy(`AI 生成 ${plan.missing} 张角色图...`, () =>
    api(`/api/projects/${currentProjectId}/characters/references/generate`, {
      method: 'POST', body: JSON.stringify({}),
    }));
}

// ── 批量生产 ────────────────────────────────────────────────────────

const ITEM_STATUS_LABEL = {
  pending: '等待', running: '进行中', succeeded: '完成', failed: '失败', cancelled: '已取消',
};

function stopBatchPolling() {
  if (batchPollTimer) { clearTimeout(batchPollTimer); batchPollTimer = null; }
}

function renderBatch() {
  const body = $('batch-body');
  if (!body) return;
  const batch = currentBatch;
  const active = !!(batch && batch.is_active);

  const tags = $('batch-tags');
  if (tags) {
    tags.innerHTML = batch
      ? `<span class="tag-mini">${batch.summary.succeeded}/${batch.summary.total} 完成</span>` +
        (batch.summary.failed ? `<span class="tag-mini warn">${batch.summary.failed} 失败</span>` : '') +
        `<span class="tag-mini ${active ? '' : 'ok'}">${esc(batch.status)}</span>`
      : '';
  }

  const cancelBtn = $('btn-batch-cancel');
  const startBtn = $('btn-batch');
  if (cancelBtn) cancelBtn.style.display = active ? '' : 'none';
  if (startBtn) startBtn.disabled = active;

  if (!batch) { body.innerHTML = ''; return; }

  body.innerHTML = `
    <div class="progress-wrap" style="display:block">
      <div class="progress-bar"><div class="progress-fill" style="width:${batch.percent}%"></div></div>
      <div class="progress-text">${esc(batch.message || batch.status)}（${batch.percent}%，批量 ${batch.id}）</div>
    </div>
    <table class="cost-table" style="margin-top:8px">
      <thead><tr><th>#</th><th>标题</th><th>状态</th><th>阶段</th><th>项目</th></tr></thead>
      <tbody>${batch.items.map(item => `
        <tr>
          <td>${item.index + 1}</td>
          <td>${esc(item.title)}</td>
          <td><span class="tag-mini ${item.status === 'failed' ? 'warn' : item.status === 'succeeded' ? 'ok' : ''}">${esc(ITEM_STATUS_LABEL[item.status] || item.status)}</span></td>
          <td>${esc(item.stage || '-')}</td>
          <td>${item.project_id
            ? `<a href="#" onclick="selectProject('${item.project_id}');return false;">${esc(item.project_id)}</a>`
            : '-'}</td>
        </tr>
        ${item.error ? `<tr><td></td><td colspan="4" class="clip-error">${esc(item.error)}</td></tr>` : ''}
      `).join('')}</tbody>
    </table>
  `;

  if (active) scheduleBatchPoll(); else stopBatchPolling();
}

function scheduleBatchPoll() {
  stopBatchPolling();
  batchPollTimer = setTimeout(refreshBatch, 1500);
}

async function refreshBatch() {
  if (!currentBatch) return;
  const data = await safeGet(`/api/batches/${currentBatch.id}`);
  if (!data) return;
  currentBatch = data;
  renderBatch();
}

function doStartBatch() {
  const lines = ($('batch-items').value || '')
    .split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) { alert('请至少填一个主题（每行一个）'); return; }
  const payload = {
    items: lines.map(text => ({ input_text: text })),
    target_duration_sec: Number($('batch-duration').value || 45),
    stop_after: $('batch-stop').value,
    audio_script_mode: ($('batch-script-mode') && $('batch-script-mode').value) || '',
    concurrency: Number($('batch-concurrency').value || 1),
    model: currentModel(),
    aspect_ratio: (currentProject && currentProject.aspect_ratio) || '9:16',
  };
  withBusy('提交批量任务...', async () => {
    currentBatch = await api('/api/batches', { method: 'POST', body: JSON.stringify(payload) });
    renderBatch();
  });
}

function doCancelBatch() {
  if (!currentBatch) return;
  withBusy('取消批量任务...', () =>
    api(`/api/batches/${currentBatch.id}/cancel`, { method: 'POST' }));
}

// ── 生成 / 确认 / 退回 ──────────────────────────────────────────────

function doGenerateBible() {
  const region = valueOf('cast-region');
  const notes = valueOf('bible-notes').trim();
  const body = { model: currentModel(), cast_region: region, notes };
  let label = '生成故事圣经中（约 10 秒）...';
  if (currentProject && currentProject.input_mode === 'novel') {
    const n = parseInt(valueOf('novel-chapters'), 10) || 3;
    body.novel_chapters = n;
    if (!confirm(`小说模式：切章（$0）→ 逐章抽取前 ${n} 章的人物/场景/道具 → 合并成圣经。\n只花 LLM 的钱，不花视频费。继续？`)) return;
    label = `切章并抽取前 ${n} 章（约 ${n * 10} 秒）...`;
  }
  withBusy(label, () =>
    api(`/api/projects/${currentProjectId}/bible/generate`, {
      method: 'POST', body: JSON.stringify(body),
    }));
}

function onInputModeChange() {
  const novel = $('inp-mode').value === 'novel';
  $('inp-text').placeholder = novel
    ? '粘贴小说原文（自动按「第X章 / Chapter N」切章；没有章标题就按字数切段）'
    : '例如：一个被裁员的程序员靠 AI 逆袭创业';
}

function valueOf(id) {
  const el = document.getElementById(id);
  return el ? el.value : '';
}

// 国家限定 + 额外要求跟着项目走（重新生成/刷新页面都还在）
function renderBibleConstraint() {
  const p = currentProject || {};
  const region = document.getElementById('cast-region');
  const notes = document.getElementById('bible-notes');
  if (region && !region.dataset.touched) region.value = p.cast_region || '';
  if (notes && !notes.dataset.touched) notes.value = p.bible_notes || '';
  for (const [id, keep] of [['cast-region', 1], ['bible-notes', 1]]) {
    const el = document.getElementById(id);
    if (el && !el.dataset.bound) {
      el.dataset.bound = '1';
      el.addEventListener('input', () => { el.dataset.touched = '1'; });
      el.addEventListener('change', () => { el.dataset.touched = '1'; });
    }
  }'';
  const hint = document.getElementById('cast-region-hint');
  if (hint) {
    const declared = (currentBible && currentBible.cast_region) || p.cast_region;
    hint.textContent = declared
      ? '圣经已声明整片地区，定妆照与视频都按它来（不再靠名字猜）'
      : '';
  }
}

function doGenerateScript() {
  withBusy('逐场生成剧本中（可能需要 1-3 分钟）...', () =>
    api(`/api/projects/${currentProjectId}/script/generate`, {
      method: 'POST', body: JSON.stringify({ model: currentModel() }),
    }));
}

async function confirmWithForce(path, label) {
  // 严格模式会返回 400 + 拦截原因：先让人看原因，再问要不要强制确认
  try {
    await api(path, { method: 'POST', body: JSON.stringify({ force: false }) });
  } catch (e) {
    if (!confirm(`${label}被结构校验拦下：\n\n${e.message}\n\n仍然强制确认？（跳过后面的阶段会基于这份内容继续）`)) return;
    await api(path, { method: 'POST', body: JSON.stringify({ force: true }) });
  }
}

function doConfirmScript() {
  withBusy('确认剧本...', () =>
    confirmWithForce(`/api/projects/${currentProjectId}/script/confirm`, '确认剧本'));
}

function doReopenScript() {
  if (!confirm('退回剧本阶段会以草稿状态重新生成剧本（旧分镜将被清空），继续？')) return;
  withBusy('退回剧本阶段...', () =>
    api(`/api/projects/${currentProjectId}/script/reopen`, { method: 'POST' }));
}

function doGenerateStoryboard() {
  withBusy('生成分镜中（可能需要 1-3 分钟）...', () =>
    api(`/api/projects/${currentProjectId}/storyboard/generate`, {
      method: 'POST', body: JSON.stringify({ model: currentModel() }),
    }));
}

function doConfirmStoryboard() {
  withBusy('确认分镜...', () =>
    confirmWithForce(`/api/projects/${currentProjectId}/storyboard/confirm`, '确认分镜'));
}

function doReopenStoryboard() {
  withBusy('退回分镜阶段...', () =>
    api(`/api/projects/${currentProjectId}/storyboard/reopen`, { method: 'POST' }));
}

loadHealth();
loadProjects();

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>videogen — AI 短剧流水线</title>
<style>
:root {
  --bg: #0b0e14;
  --bg2: #0f131b;
  --surface: #151a24;
  --surface2: #1b2130;
  --border: #252d3d;
  --text: #e6e9ef;
  --text2: #94a0b4;
  --accent: #14b8a6;
  --accent2: #2dd4bf;
  --accent-soft: rgba(20, 184, 166, 0.14);
  --violet: #a78bfa;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.18);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f7fa;
  --bg2: #eef1f5;
  --surface: #ffffff;
  --surface2: #f3f5f8;
  --border: #dde3eb;
  --text: #18202e;
  --text2: #5b6779;
  --accent: #0d9488;
  --accent2: #0f766e;
  --accent-soft: rgba(13, 148, 136, 0.10);
  --violet: #7c3aed;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f5f7fa; --bg2: #eef1f5; --surface: #ffffff; --surface2: #f3f5f8;
    --border: #dde3eb; --text: #18202e; --text2: #5b6779;
    --accent: #0d9488; --accent2: #0f766e; --accent-soft: rgba(13, 148, 136, 0.10);
    --violet: #7c3aed;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 6px 18px rgba(16,24,40,.06);
    color-scheme: light;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh;
}
.create-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.create-form label { font-size: 12px; color: var(--text2); }
.create-form input, .create-form select, .create-form textarea {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 8px 10px; color: var(--text);
  font-size: 13px; outline: none;
}
.create-form textarea { resize: vertical; min-height: 60px; }
.create-form input:focus, .create-form textarea:focus, .create-form select:focus {
  border-color: var(--accent);
}
.btn {
  background: var(--accent); color: #fff; border: none;
  padding: 8px 16px; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 500;
  transition: background 0.15s;
}
.btn:hover { background: var(--accent2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-outline {
  background: transparent; border: 1px solid var(--border);
  color: var(--text);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent2); }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-green { background: var(--green); }
.btn-green:hover { background: #16a34a; }
.btn-yellow { background: var(--yellow); color: #000; }
.btn-yellow:hover { background: #ca8a04; }
.btn-danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red); color: #fff; }


.main { overflow-y: auto; padding: 24px; }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
}
.panel.pending { opacity: 0.75; border-style: dashed; }
.panel h3 {
  font-size: 14px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.panel h3 .num {
  background: var(--accent); color: #fff;
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
}
.panel-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--text2); line-height: 1.7; }

.status-tag {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 99px; font-weight: 500;
}
.status-draft { background: #374151; color: #d1d5db; }
.status-script_review { background: #78350f; color: #fbbf24; }
.status-storyboard_review { background: #78350f; color: #fbbf24; }
.status-script_confirmed { background: #14532d; color: #4ade80; }
.status-storyboard_confirmed { background: #14532d; color: #4ade80; }
.status-failed { background: #7f1d1d; color: #fca5a5; }
.status-done { background: #14532d; color: #4ade80; }

.music-block {
  margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
}
.music-sections { width: 100%; border-collapse: collapse; font-size: 12px; }
.music-sections th { color: var(--text2); font-weight: 500; text-align: left; padding: 2px 6px; }
.music-sections td { padding: 2px 6px; border-top: 1px solid var(--border); color: var(--text2); }
.music-sections td.label { color: var(--text); }
.music-sections .accents, .accents { font-size: 11px; font-weight: 400; color: var(--text2); line-height: 1.6; }
.tag-mini {
  font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: var(--bg); border: 1px solid var(--border); color: var(--text2);
}
.tag-mini.warn { border-color: var(--yellow); color: var(--yellow); }
.tag-mini.ok { border-color: var(--green); color: var(--green); }

/* 长篇剧集大纲：章卡片（选章展开成剧本） */
.story-outline { margin-bottom: 12px; }
.story-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.story-synopsis {
  font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 10px;
  max-height: 72px; overflow: auto; border-left: 2px solid var(--border); padding-left: 8px;
}
.chapter-list { max-height: 360px; overflow: auto; }
.chapter-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; margin-bottom: 6px; background: var(--bg);
}
.chapter-card.expanded { border-color: #14532d; }
.chapter-pick { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.chapter-title { font-size: 13px; font-weight: 600; }
.chapter-body { font-size: 12px; color: var(--text2); line-height: 1.7; margin-top: 6px; }
.chapter-body ul { margin: 4px 0 0 18px; padding: 0; }
.chapter-hook { color: var(--yellow); margin-top: 4px; }

.script-content { font-size: 13px; line-height: 1.6; }
.scene-block {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 12px; margin-bottom: 10px;
}
.scene-block .heading { font-weight: 600; font-size: 13px; color: var(--accent2); }
.scene-block .summary { color: var(--text2); font-size: 12px; margin: 4px 0 8px; }
.scene-block .dialogue { font-size: 12px; }
.scene-block .dialogue .speaker { color: var(--accent2); font-weight: 500; }
.scene-block .duration { font-size: 11px; color: var(--text2); margin-top: 6px; }

.shot-block {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 8px; font-size: 12px;
}
.shot-block .shot-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.shot-block .shot-no { font-weight: 600; color: var(--accent2); }
.shot-block .camera { color: var(--text2); }
.shot-block .prompt {
  background: var(--bg); border-radius: 4px; padding: 6px 8px;
  margin-top: 6px; font-family: monospace; font-size: 11px;
  color: #a5b4fc; word-break: break-all;
}

.issue-list { margin-top: 8px; }
.issue-item {
  font-size: 12px; padding: 6px 10px; border-radius: 6px;
  margin-bottom: 4px; display: flex; gap: 8px; align-items: flex-start;
}
.issue-error { background: #7f1d1d33; border-left: 3px solid var(--red); }
.issue-warning { background: #78350f33; border-left: 3px solid var(--yellow); }
.issue-info { background: #1e3a5f33; border-left: 3px solid #60a5fa; }

.loading {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: middle; margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.bible-chars { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.char-tag {
  background: var(--bg); border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 6px; font-size: 12px;
}
.char-tag .name { font-weight: 500; }
.char-tag .role { color: var(--text2); font-size: 11px; }
.char-tag .ref-thumb {
  width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
  border: 1px solid var(--border); background: #000;
}
.char-tag .ref-thumb.empty {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--text2);
}

/* JSON Editor */
.bible-constraint {
  margin: 10px 0 4px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg2, transparent);
}
.bible-constraint label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 6px;
}
.bible-constraint select,
.bible-constraint textarea {
  width: 100%;
  margin-top: 4px;
  font-size: 12px;
}
.json-editor {
  display: none;
  margin-top: 10px;
}
.json-editor.active { display: block; }
.json-editor textarea {
  width: 100%;
  min-height: 320px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  color: #93c5fd;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  line-height: 1.5;
  resize: vertical;
  outline: none;
  tab-size: 2;
}
.json-editor textarea:focus { border-color: var(--accent); }
.json-editor .editor-actions {
  display: flex; gap: 8px; margin-top: 8px; align-items: center;
}
.json-editor .error-msg {
  color: var(--red); font-size: 12px; margin-left: 8px;
}

/* Scene/Shot edit forms */
.edit-form {
  display: none;
  margin-top: 10px;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.edit-form.active { display: block; }
.edit-form label {
  display: block; font-size: 11px; color: var(--text2);
  margin-bottom: 4px; margin-top: 8px;
}
.edit-form label:first-child { margin-top: 0; }
.edit-form input, .edit-form textarea, .edit-form select {
  width: 100%;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 10px; color: var(--text);
  font-size: 12px; outline: none;
}
.edit-form textarea { resize: vertical; min-height: 50px; font-family: inherit; }
.edit-form input:focus, .edit-form textarea:focus { border-color: var(--accent); }
.edit-form .row { display: flex; gap: 8px; }
.edit-form .row > * { flex: 1; }
.edit-form .form-actions { display: flex; gap: 8px; margin-top: 12px; }

.scene-actions { display: flex; gap: 6px; margin-top: 8px; }
.shot-actions { display: flex; gap: 6px; margin-top: 6px; }

/* 视频片段 */
.clip-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px; margin-top: 10px;
}
.clip-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px; background: var(--bg); font-size: 12px;
}
.clip-card video {
  width: 100%; border-radius: 6px; background: #000; display: block;
  aspect-ratio: 9 / 16; object-fit: contain;
}
.clip-card .clip-head {
  display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;
}
.clip-card .clip-no { font-weight: 600; color: var(--accent2); }
.clip-card .clip-prompt {
  color: var(--text2); font-size: 11px; margin-top: 6px; line-height: 1.5;
  max-height: 52px; overflow: hidden;
}
.clip-card .clip-error { color: var(--red); font-size: 11px; margin-top: 6px; }
.clip-card.pending { opacity: 0.6; }

.char-tag .ref-upload {
  font-size: 10px; color: var(--accent2); cursor: pointer; border: 1px dashed var(--border);
  border-radius: 4px; padding: 0 4px; margin-left: 4px;
}
.char-tag .ref-upload input { display: none; }
.btn-xs { padding: 0 5px; font-size: 10px; }
.cost-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.cost-table th, .cost-table td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.cost-table thead th { color: var(--text2); font-weight: 500; }
.cost-table tfoot th { color: var(--text); }
.voice-map { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.voice-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.voice-row .voice-name { color: var(--text2); }
.voice-row select {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 6px; font-size: 12px; font-family: inherit;
}
.clip-card audio { width: 100%; height: 32px; margin-top: 6px; }
.progress-wrap { margin-top: 10px; }
.progress-bar {
  height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden;
  border: 1px solid var(--border);
}
.progress-fill {
  height: 100%; background: var(--accent); width: 0%;
  transition: width 0.3s ease;
}
.progress-text { font-size: 12px; color: var(--text2); margin-top: 6px; }

/* ── 外壳：顶栏 / 视图 ─────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--violet)); color: #fff; font-size: 14px;
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.brand-sub { font-size: 11px; color: var(--text2); }
.nav-tabs { display: flex; gap: 4px; background: var(--surface); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
.nav-tabs button {
  border: 0; background: transparent; color: var(--text2); padding: 6px 14px; border-radius: 8px;
  font-size: 13px; cursor: pointer;
}
.nav-tabs button.active { background: var(--accent-soft); color: var(--accent2); font-weight: 600; }
.spacer { flex: 1; }
.icon-btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text2);
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px;
}
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
#global-status { font-size: 12px; color: var(--accent2); }
.view { padding: 24px; max-width: 1480px; margin: 0 auto; }
.view[hidden] { display: none; }

/* ── 项目首页 ─────────────────────────────────────────────────── */
.home-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.home-head h1 { font-size: 22px; font-weight: 700; }
.home-head .sub { color: var(--text2); font-size: 13px; }
.home-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.search {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; padding: 8px 12px; font-size: 13px; min-width: 220px; outline: none;
}
.search:focus { border-color: var(--accent); }
.chip {
  border: 1px solid var(--border); background: var(--surface); color: var(--text2);
  padding: 5px 12px; border-radius: 99px; font-size: 12px; cursor: pointer;
}
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.stat-chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--surface2); color: var(--text2); }
.stat-chip.accent { background: var(--accent-soft); color: var(--accent2); }
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.project-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s, border-color .12s;
  position: relative;
}
.project-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.project-cover {
  height: 168px; position: relative; display: grid; place-items: center;
  background:
    radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 60%),
    radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, var(--violet) 26%, transparent), transparent 60%),
    var(--surface2);
}
.project-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 42%; }
.project-cover .corner, .project-cover .ratio { z-index: 1; }
.project-cover .cover-icon { font-size: 26px; opacity: .55; }
.project-cover .corner { position: absolute; top: 8px; left: 8px; }
.project-cover .ratio {
  position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 1px 6px; border-radius: 6px;
  background: rgba(0,0,0,.45); color: #fff;
}
.project-card .body { padding: 12px 14px 14px; }
.project-card .title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.project-card .meta { font-size: 12px; color: var(--text2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.mode-badge { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent2); }
.project-card .del {
  position: absolute; top: 8px; right: 8px; display: none; border: 0; border-radius: 7px;
  background: rgba(0,0,0,.5); color: #fff; width: 26px; height: 26px; cursor: pointer;
}
.project-card:hover .del { display: block; }
.project-card .del:hover { background: var(--red); }
.empty-card {
  border: 1px dashed var(--border); border-radius: var(--radius); padding: 48px 16px; text-align: center;
  color: var(--text2); grid-column: 1 / -1;
}

/* ── 新建项目弹窗 ─────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 14, .6);
  display: grid; place-items: center; padding: 16px;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  width: min(560px, 100%); max-height: 90vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow);
}
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal .sub { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
.mode-pick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.mode-pick label {
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; cursor: pointer;
  font-size: 13px; color: var(--text); display: flex; flex-direction: column; gap: 2px;
}
.mode-pick label small { color: var(--text2); font-size: 11px; }
.mode-pick input { display: none; }
.mode-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.create-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.create-form .row2 > div { display: flex; flex-direction: column; gap: 6px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

/* ── 项目工作区：头部 + 左侧阶段导航 ──────────────────────────── */
.proj-header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.proj-header .back { border: 1px solid var(--border); background: var(--surface2); color: var(--text); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.proj-header .ptitle { font-size: 16px; font-weight: 700; }
.proj-header .pmeta { font-size: 12px; color: var(--text2); }
.proj-header .next { font-size: 12px; color: var(--accent2); }
.proj-header select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 8px; font-size: 12px; }
.workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.stage-nav {
  position: sticky; top: 72px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow);
}
.stage-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--text); padding: 8px 10px; border-radius: 9px;
  cursor: pointer; font-size: 13px;
}
.stage-item:hover { background: var(--surface2); }
.stage-item.active { background: var(--accent-soft); }
.stage-item.active .stage-label { color: var(--accent2); font-weight: 600; }
.stage-dot {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 11px; border: 1.5px solid var(--border); color: var(--text2);
}
.stage-item.done .stage-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.stage-item.current .stage-dot { border-color: var(--accent2); color: var(--accent2); box-shadow: 0 0 0 3px var(--accent-soft); }
.stage-text { display: flex; flex-direction: column; min-width: 0; }
.stage-sub { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage-progress { margin: 10px 6px 4px; font-size: 11px; color: var(--text2); }
.stage-progress .bar { height: 5px; border-radius: 99px; background: var(--surface2); margin-top: 6px; overflow: hidden; }
.stage-progress .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--violet)); }
.stage-body > .panel[data-stage] { display: none; }
.stage-body > .panel[data-stage].shown { display: block; }

/* ── 剧集资产卡片 ─────────────────────────────────────────────── */
.asset-section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin: 16px 0 8px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.asset-section-head .count { white-space: normal; }
.asset-section-head .count { font-weight: 400; color: var(--text2); font-size: 12px; }
.asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.asset-card {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
}
.asset-img { aspect-ratio: 4 / 3; background: var(--bg2); display: grid; place-items: center; position: relative; }
.asset-card.kind-characters .asset-img { aspect-ratio: 3 / 4; }
.asset-img img { width: 100%; height: 100%; object-fit: cover; }
.asset-img .ph { font-size: 28px; opacity: .35; }
.asset-img .state {
  position: absolute; top: 6px; left: 6px; font-size: 10px; padding: 1px 7px; border-radius: 99px;
  background: rgba(0,0,0,.55); color: #fff;
}
.asset-img .state.ok { background: color-mix(in srgb, var(--green) 85%, black); }
.asset-info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.asset-name { font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.asset-role { font-size: 10px; padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent2); font-weight: 500; }
.asset-desc { font-size: 11px; color: var(--text2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.asset-usage { font-size: 11px; color: var(--text2); }
.asset-actions { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
.btn-xs { padding: 3px 9px; font-size: 11px; border-radius: 6px; }
.asset-actions .ref-upload {
  font-size: 11px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; color: var(--text2);
}
.asset-actions .ref-upload input { display: none; }

/* ── 分镜：按段落分组 ─────────────────────────────────────────── */
.segment-block {
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden;
  background: var(--bg2);
}
.segment-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px;
  background: var(--surface2); border-bottom: 1px solid var(--border);
}
.segment-head .seg-name { font-weight: 600; color: var(--violet); }
.segment-timeline { display: flex; height: 6px; border-radius: 99px; overflow: hidden; flex: 1; max-width: 260px; gap: 2px; }
.segment-timeline span { background: var(--accent); opacity: .75; }
.segment-timeline span:nth-child(2n) { background: var(--violet); }
.segment-block .shot-block { margin: 8px; }
.seg-chip { font-size: 10px; padding: 0 6px; border-radius: 5px; background: color-mix(in srgb, var(--violet) 18%, transparent); color: var(--violet); }

@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; }
  .stage-nav { position: static; display: flex; overflow-x: auto; gap: 4px; }
  .stage-item { width: auto; flex: none; }
  .stage-sub, .stage-progress { display: none; }
  .view { padding: 16px; }
  .topbar { padding: 10px 16px; gap: 10px; }
  .brand-sub, #health { display: none; }
}
.view .main { padding: 0; overflow: visible; }

.status-tag { display: inline-block; }
.status-video_generating, .status-audio_generating, .status-composing { background: #1e3a8a; color: #bfdbfe; }
.status-video_ready, .status-audio_ready { background: #134e4a; color: #99f6e4; }
:root[data-theme="light"] .status-video_generating, :root[data-theme="light"] .status-audio_generating,
:root[data-theme="light"] .status-composing { background: #dbeafe; color: #1e40af; }
:root[data-theme="light"] .status-video_ready, :root[data-theme="light"] .status-audio_ready { background: #ccfbf1; color: #115e59; }
.proj-header #model-hint { font-size: 11px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">▶</span>
    <div><div class="brand-name">videogen</div><div class="brand-sub">AI 短剧工坊</div></div>
  </div>
  <nav class="nav-tabs">
    <button id="tab-projects" class="active" onclick="showHome()">项目</button>
    <button id="tab-batch" onclick="showBatch()">批量生产</button>
  </nav>
  <span class="spacer"></span>
  <span id="global-status"></span>
  <span id="health" style="font-size:12px;color:var(--text2)"></span>
  <button class="icon-btn" onclick="toggleTheme()" title="切换明暗主题">◐</button>
</header>

<section class="view" id="home-view">
  <div class="home-head">
    <div>
      <h1>项目</h1>
      <div class="sub">从一句创意或一部小说，到一条带配音和配乐的短剧</div>
    </div>
    <span class="spacer"></span>
    <span id="home-stats" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    <button class="btn" onclick="openCreate()">＋ 新建项目</button>
  </div>
  <div class="home-tools">
    <input class="search" id="project-search" placeholder="搜索项目" oninput="renderProjectGrid()">
    <span id="status-filters" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  </div>
  <div class="project-grid" id="project-list"></div>
</section>

<section class="view" id="batch-view" hidden>
  <div class="home-head">
    <div>
      <h1>批量生产</h1>
      <div class="sub">一次提交多个主题，自动跑完整条链路（跳过人工确认门控）</div>
    </div>
  </div>
  <div id="batch-root"></div>
</section>

<section class="view" id="project-view" hidden>
  <div class="main" id="main"></div>
</section>

<div class="modal-backdrop" id="create-modal" hidden onclick="if (event.target === this) closeCreate()">
  <div class="modal">
    <h2>新建项目</h2>
    <div class="sub">选一种输入方式。小说会自动切章，之后按章挑着拍。</div>
    <div class="create-form">
      <label>标题</label>
      <input id="inp-title" placeholder="都市逆袭短剧" value="">
      <label>输入方式</label>
      <div class="mode-pick" id="mode-pick">
        <label><input type="radio" name="inp-mode-radio" value="theme" checked onchange="setInputMode(this.value)">主题 / 关键词<small>一句话创意，AI 写故事</small></label>
        <label><input type="radio" name="inp-mode-radio" value="outline" onchange="setInputMode(this.value)">故事大纲<small>已有梗概，AI 扩写</small></label>
        <label><input type="radio" name="inp-mode-radio" value="full_script" onchange="setInputMode(this.value)">完整剧本<small>按现成剧本拆分</small></label>
        <label><input type="radio" name="inp-mode-radio" value="novel" onchange="setInputMode(this.value)">小说原文<small>自动切章，按章改编</small></label>
      </div>
      <select id="inp-mode" hidden>
        <option value="theme">主题/关键词</option>
        <option value="outline">故事大纲</option>
        <option value="full_script">完整剧本</option>
        <option value="novel">小说原文（按章改编）</option>
      </select>
      <label>输入内容</label>
      <textarea id="inp-text" rows="6" placeholder="例如：一个被裁员的程序员靠 AI 逆袭创业"></textarea>
      <div class="row2">
        <div>
          <label>画面比例</label>
          <select id="inp-aspect">
            <option value="9:16">竖屏 9:16（抖音）</option>
            <option value="16:9">横屏 16:9（B站）</option>
            <option value="1:1">方形 1:1</option>
          </select>
        </div>
        <div>
          <label>目标时长（秒）</label>
          <input id="inp-duration" type="number" value="45" min="5" max="600">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeCreate()">取消</button>
        <button class="btn" onclick="createProject()">创建项目</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── 状态与鉴权 ──────────────────────────────────────────────────────

const STATUS_LABEL = {
  draft: '草稿',
  script_review: '剧本待确认',
  script_confirmed: '剧本已确认',
  storyboard_review: '分镜待确认',
  storyboard_confirmed: '分镜已确认',
  video_generating: '视频生成中',
  video_ready: '视频就绪',
  audio_generating: '配音生成中',
  audio_ready: '配音就绪',
  composing: '合成中',
  done: '完成',
  failed: '失败',
};

// 支持 ?token=xxx 一次性注入，然后记住
(function initToken() {
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (fromUrl) {
    localStorage.setItem('videogen_token', fromUrl);
    history.replaceState(null, '', location.pathname);
  }
})();

function authHeaders() {
  const token = localStorage.getItem('videogen_token');
  return token ? { 'X-API-Token': token } : {};
}

// `<img>` / `<video>` / `<a download>` 带不了请求头，只能把 token 放进 URL。
// 服务端只对**只读产物**路径接受 ?token=（写接口只认请求头）。
function withToken(url) {
  const token = localStorage.getItem('videogen_token');
  if (!token) return url;
  return `${url}${url.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`;
}

let currentProjectId = null;
let currentBible = null;
let currentStoryOutline = null;
let currentOutlineData = null;
let currentScript = null;
let currentStoryboard = null;
let currentProject = null;
let currentVideo = null;
let currentAudio = null;
let currentCompose = null;
let currentMusic = null;
let currentCost = null;
let currentBatch = null;
let serverHealth = null;
let modelInfo = null;
let costPollTimer = null;
let batchPollTimer = null;
let videoPollTimer = null;
let audioPollTimer = null;
let composePollTimer = null;

const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const resp = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    ...opts,
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.detail || resp.statusText);
  }
  return resp.json();
}

function statusTag(status) {
  const label = STATUS_LABEL[status] || status;
  return `<span class="status-tag status-${status}">${esc(label)}</span>`;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function el(id) { return $(id); }

// ── 通用动作包装：忙提示 + 刷新 ─────────────────────────────────────

async function withBusy(label, fn) {
  $('global-status').innerHTML = `<span class="loading"></span>${esc(label)}`;
  try {
    await fn();
    await refresh();
  } catch (e) {
    alert(`${label}失败：${e.message}`);
  } finally {
    $('global-status').textContent = '';
  }
}

async function refresh() {
  await loadProjects();
  if (currentProjectId) await renderProject(currentProjectId);
}

async function loadHealth() {
  try {
    const h = await api('/api/health');
    serverHealth = h;
    const ok = h.llm_key_configured;
    $('health').innerHTML =
      `<span class="tag-mini ${ok ? 'ok' : 'warn'}">LLM ${ok ? '已配置' : '未配置 Key'}</span>` +
      (h.ffmpeg_can_burn_subtitles ? ' <span class="tag-mini ok">可烧字幕</span>' : '') +
      (h.auth_enabled ? ' <span class="tag-mini ok">鉴权开启</span>' : '');
    // 配音文案的默认模式跟着服务端配置走（off = 不额外花钱）
    if (h.audio_script_mode && SCRIPT_MODES.some(([value]) => value === h.audio_script_mode)) {
      audioScriptMode = h.audio_script_mode;
    }
    if (typeof h.audio_script_vision === 'boolean') audioScriptVision = h.audio_script_vision;
    try {
      const models = await api('/api/models');
      modelInfo = models;
      applyVoiceCatalog(models.voices, models.voices_cloud, models.tts_provider);
    } catch (e) { /* 拿不到就用兜底表 */ }
  } catch (e) {
    $('health').textContent = '';
  }
}

// ── 项目列表 ────────────────────────────────────────────────────────

let allProjects = [];
let projectFilter = 'all';

const PROJECT_FILTERS = [
  ['all', '全部'],
  ['draft', '待开始'],
  ['working', '进行中'],
  ['done', '已出片'],
  ['failed', '失败'],
];
const MODE_LABEL = { theme: '主题', outline: '大纲', full_script: '剧本', novel: '小说' };

function projectBucket(p) {
  if (p.status === 'draft') return 'draft';
  if (p.status === 'done') return 'done';
  if (p.status === 'failed') return 'failed';
  return 'working';
}

async function loadProjects() {
  allProjects = await api('/api/projects');
  renderProjectGrid();
}

function renderProjectGrid() {
  const list = $('project-list');
  if (!list) return;
  const counts = { all: allProjects.length, draft: 0, working: 0, done: 0, failed: 0 };
  allProjects.forEach(p => { counts[projectBucket(p)] += 1; });
  $('home-stats').innerHTML =
    `<span class="stat-chip">${counts.all} 个项目</span>` +
    `<span class="stat-chip accent">${counts.working} 进行中</span>` +
    `<span class="stat-chip">${counts.done} 已出片</span>`;
  $('status-filters').innerHTML = PROJECT_FILTERS.map(([key, label]) =>
    `<button class="chip ${projectFilter === key ? 'active' : ''}" onclick="setProjectFilter('${key}')">${label}${key !== 'all' && counts[key] ? ` ${counts[key]}` : ''}</button>`
  ).join('');
  const q = ($('project-search').value || '').trim().toLowerCase();
  const shown = allProjects
    .filter(p => projectFilter === 'all' || projectBucket(p) === projectFilter)
    .filter(p => !q || (p.title || '').toLowerCase().includes(q))
    .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  if (!shown.length) {
    list.innerHTML = allProjects.length
      ? '<div class="empty-card">没有符合条件的项目</div>'
      : '<div class="empty-card">还没有项目。点右上角「新建项目」，从一句创意或一部小说开始。</div>';
    return;
  }
  list.innerHTML = shown.map(p => `
    <div class="project-card" onclick="selectProject('${p.id}')">
      <div class="project-cover">
        <span class="cover-icon">${p.input_mode === 'novel' ? '📖' : '🎬'}</span>
        <img class="cover-img" alt="" loading="lazy" onerror="this.remove()"
             src="${withToken(`/api/projects/${p.id}/assets/characters/char_1/reference`)}">
        <span class="corner">${statusTag(p.status)}</span>
        <span class="ratio">${esc(p.aspect_ratio)}</span>
      </div>
      <button class="del" title="删除项目"
              onclick="event.stopPropagation(); deleteProject('${p.id}', '${esc(p.title)}')">✕</button>
      <div class="body">
        <div class="title">${esc(p.title) || '未命名'}</div>
        <div class="meta">
          <span class="mode-badge">${esc(MODE_LABEL[p.input_mode] || p.input_mode)}</span>
          <span>目标 ${p.target_duration_sec}s</span>
          <span>· ${esc(String(p.created_at || '').slice(0, 10))}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function setProjectFilter(key) {
  projectFilter = key;
  renderProjectGrid();
}

// ── 视图切换 / 主题 ─────────────────────────────────────────────────

function showView(name) {
  ['home', 'batch', 'project'].forEach(v => { $(`${v}-view`).hidden = v !== name; });
  $('tab-projects').classList.toggle('active', name !== 'batch');
  $('tab-batch').classList.toggle('active', name === 'batch');
  window.scrollTo(0, 0);
}

function showHome() {
  currentProjectId = null;
  stopProjectPolling();
  showView('home');
  loadProjects().catch(() => {});
}

async function showBatch() {
  showView('batch');
  $('batch-root').innerHTML = batchPanelHtml();
  if (!currentBatch || !currentBatch.is_active) {
    const batchList = await safeGet('/api/batches?limit=1');
    if (Array.isArray(batchList) && batchList.length) currentBatch = batchList[0];
  }
  renderBatch();
}

function stopProjectPolling() {
  [videoPollTimer, audioPollTimer, composePollTimer, costPollTimer].forEach(t => t && clearTimeout(t));
  videoPollTimer = audioPollTimer = composePollTimer = costPollTimer = null;
}

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === 'dark'
    : !window.matchMedia('(prefers-color-scheme: light)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('videogen_theme', root.dataset.theme); } catch (e) { /* 存不了就算了 */ }
}

(function initTheme() {
  try {
    const saved = localStorage.getItem('videogen_theme');
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) { /* 隐私模式下读不到 */ }
})();

function openCreate() {
  $('create-modal').hidden = false;
  setTimeout(() => $('inp-title').focus(), 0);
}

function closeCreate() { $('create-modal').hidden = true; }

function setInputMode(value) {
  $('inp-mode').value = value;
  onInputModeChange();
}

async function createProject() {
  const body = {
    title: $('inp-title').value || '未命名项目',
    input_mode: $('inp-mode').value,
    input_text: $('inp-text').value,
    aspect_ratio: $('inp-aspect').value,
    target_duration_sec: parseInt($('inp-duration').value) || 45,
  };
  if (!body.input_text.trim()) { alert('请输入内容'); return; }
  try {
    $('global-status').textContent = '创建中...';
    const p = await api('/api/projects', { method: 'POST', body: JSON.stringify(body) });
    closeCreate();
    $('inp-text').value = '';
    $('inp-title').value = '';
    await selectProject(p.id);
  } catch (e) {
    alert('创建失败: ' + e.message);
  } finally {
    $('global-status').textContent = '';
  }
}

async function selectProject(id) {
  if (currentProjectId !== id) { activeStage = null; lastStageStatus = null; }
  currentProjectId = id;
  showView('project');
  await refresh();
}

async function deleteProject(id, title) {
  if (!confirm(`确定删除项目「${title}」？该操作会删除磁盘上的全部产物。`)) return;
  try {
    await api(`/api/projects/${id}`, { method: 'DELETE' });
    if (currentProjectId === id) showHome();
    await loadProjects();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// ── 渲染 ────────────────────────────────────────────────────────────

async function safeGet(path) {
  try { return await api(path); } catch (e) { return null; }
}

async function renderProject(id) {
  const p = await api(`/api/projects/${id}`);
  currentProject = p;
  const main = $('main');

  // 先取数据再渲染，避免用到上一个项目残留的 currentScript/currentStoryboard
  currentBible = await safeGet(`/api/projects/${id}/bible`);
  currentStoryOutline = await safeGet(`/api/projects/${id}/story-outline`);
  currentOutlineData = await safeGet(`/api/projects/${id}/outline`);
  currentScript = await safeGet(`/api/projects/${id}/script`);
  currentStoryboard = await safeGet(`/api/projects/${id}/storyboard`);
  currentVideo = await safeGet(`/api/projects/${id}/video/status`);
  currentAudio = await safeGet(`/api/projects/${id}/audio/status`);
  currentCompose = await safeGet(`/api/projects/${id}/compose/status`);
  currentMusic = await safeGet(`/api/projects/${id}/music`);
  currentCost = await safeGet(`/api/projects/${id}/cost`);
  await loadPreflight('all');
  if (!modelInfo) {
    modelInfo = await safeGet('/api/models');
    if (modelInfo) applyVoiceCatalog(modelInfo.voices, modelInfo.voices_cloud, modelInfo.tts_provider);
  }
  // 刷新页面后也能看到最近一次批量任务（进行中的继续轮询）
  if (!currentBatch || !currentBatch.is_active) {
    const batchList = await safeGet('/api/batches?limit=1');
    if (Array.isArray(batchList) && batchList.length) currentBatch = batchList[0];
  }

  const scriptTotal = currentScript ? currentScript.scenes.reduce((a, s) => a + s.duration_sec, 0) : null;

  let html = '';
  const header = `
    <div class="proj-header">
      <button class="back" onclick="showHome()">← 项目</button>
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="ptitle">${esc(p.title)}</span> ${statusTag(p.status)}
          <span class="mode-badge">${esc(MODE_LABEL[p.input_mode] || p.input_mode)}</span>
        </div>
        <div class="pmeta">${p.aspect_ratio} · 目标 ${p.target_duration_sec}s ·
          ${esc((p.input_text || '').replace(/\s+/g, ' ').substring(0, 60))}${(p.input_text || '').length > 60 ? '…' : ''}</div>
      </div>
      <span class="spacer"></span>
      <span class="next">下一步：${esc(nextStep(p.status))}</span>
      <label class="pmeta" style="display:flex;align-items:center;gap:6px">LLM
        <select id="project-model"></select>

// ── 项目工作区：左侧阶段导航 ────────────────────────────────────────
// 所有阶段面板都照常渲染（各自的 render 函数按 id 找元素），导航只决定显示哪一个。

let activeStage = null;
let lastStageStatus = null;

const STAGES = [
  ['bible', '圣经与资产'],
  ['script', '剧本'],
  ['storyboard', '分镜'],
  ['video', '视频'],
  ['audio', '配音'],
  ['compose', '成片与配乐'],
  ['cost', '成本'],
];
const FLOW = ['bible', 'script', 'storyboard', 'video', 'audio', 'compose'];

function stageForStatus(p) {
  switch (p.status) {
    case 'draft': return currentBible ? 'script' : 'bible';
    case 'script_review': return 'script';
    case 'script_confirmed':
    case 'storyboard_review': return 'storyboard';
    case 'storyboard_confirmed':
    case 'video_generating': return 'video';
    case 'video_ready':
    case 'audio_generating': return 'audio';
    case 'audio_ready':
    case 'composing':
    case 'done': return 'compose';
    default: {
      const clips = currentVideo && currentVideo.manifest && currentVideo.manifest.clips;
      if (clips && clips.length) return 'video';
      if (currentStoryboard) return 'storyboard';
      if (currentScript || currentStoryOutline) return 'script';
      return 'bible';
    }
  }
}

function stageSub(key) {
  const sb = currentStoryboard;
  switch (key) {
    case 'bible': {
      const b = currentBible;
      if (!b) return '未生成';
      return `${b.characters.length} 角色 · ${b.settings.length} 场景 · ${(b.props || []).length} 道具`;
    }
    case 'script': {
      if (currentScript) {
        const sec = currentScript.scenes.reduce((a, x) => a + x.duration_sec, 0);
        return `${currentScript.scenes.length} 场 · ${sec}s`;
      }
      return currentStoryOutline ? `${currentStoryOutline.chapters.length} 章待选` : '未生成';
    }
    case 'storyboard': {
      if (!sb) return '未生成';
      const segs = new Set(sb.shots.map(x => x.segment_id).filter(Boolean)).size;
      return `${sb.shots.length} 镜${segs ? ` · ${segs} 段` : ''}`;
    }
    case 'video': {
      const sm = currentVideo && currentVideo.summary;
      return sm ? `${sm.ready}/${sm.total} 片段` : '未生成';
    }
    case 'audio': {
      const sm = currentAudio && currentAudio.summary;
      return sm ? `${sm.ready}/${sm.total} 条` : '未生成';
    }
    case 'compose': return currentProject && currentProject.status === 'done' ? '已出片' : '未合成';
    case 'cost': {
      const sm = currentCost && currentCost.summary;
      return sm && sm.entries ? usd(sm.total_usd) : '$0';
    }
    default: return '';
  }
}

function renderStageNav() {
  const nav = $('stage-nav');
  const p = currentProject;
  if (!nav || !p) return;
  const auto = stageForStatus(p);
  // 状态变了（例如刚确认剧本 / 视频跑完）就跟着流程走到下一步；同一状态下尊重手动选择
  if (!activeStage || lastStageStatus !== p.status) activeStage = auto;
  lastStageStatus = p.status;
  const doneAll = p.status === 'done';
  const currentIndex = FLOW.indexOf(auto);
  nav.innerHTML = STAGES.map(([key, label], i) => {
    const flowIndex = FLOW.indexOf(key);
    const done = flowIndex >= 0 && (doneAll || flowIndex < currentIndex);
    const current = !doneAll && key === auto;
    const mark = done ? '✓' : flowIndex >= 0 ? String(flowIndex + 1) : '$';
    return `<button class="stage-item ${done ? 'done' : ''} ${current ? 'current' : ''} ${key === activeStage ? 'active' : ''}"
                    onclick="selectStage('${key}')">
      <span class="stage-dot">${mark}</span>
      <span class="stage-text"><span class="stage-label">${label}</span><span class="stage-sub">${esc(stageSub(key))}</span></span>
    </button>`;
  }).join('') + `
    <div class="stage-progress">流程进度 ${doneAll ? FLOW.length : Math.max(0, currentIndex)}/${FLOW.length}
      <div class="bar"><span style="width:${Math.round(100 * (doneAll ? FLOW.length : Math.max(0, currentIndex)) / FLOW.length)}%"></span></div>
    </div>`;
  applyStage();
}

function applyStage() {
  document.querySelectorAll('#stage-body > .panel[data-stage]').forEach(panel => {
    panel.classList.toggle('shown', panel.dataset.stage === activeStage);
  });
}

function selectStage(key) {
  activeStage = key;
  renderStageNav();
  window.scrollTo({ top: 0 });
}

// 展示用：圣经 id → 名字（角色 / 场景 / 道具）。编辑框里仍然用 id，保证能原样存回
function assetName(kind, id) {
  const items = (currentBible && currentBible[kind]) || [];
  const hit = items.find(x => x.id === id);
  return hit ? hit.name : (id || '');
}

function speakerName(id) {
  if (id === 'narrator') return '旁白';
  return assetName('characters', id);
}

function namesOf(kind, ids) {
  return (ids || []).map(id => assetName(kind, id)).filter(Boolean).join('、');
}

function inStatus(p, statuses) { return statuses.includes(p.status); }

function nextStep(status) {
  return ({
    draft: '生成故事圣经',
    failed: '上次生成失败，可重试（已完成的场次会续跑）',
    script_review: '检查剧本与校验报告 → 确认剧本',
    script_confirmed: '生成分镜',
    storyboard_review: '检查分镜 → 确认分镜',
    storyboard_confirmed: '生成视频片段',
    video_generating: '视频片段生成中…',
    video_ready: '生成配音（Edge-TTS）',
    audio_generating: '配音生成中…',
    audio_ready: '合成成片（FFmpeg）',
    composing: '成片合成中…',
    done: '已出片：可下载成片 / 重新合成（也可以批量生产更多主题）',
  })[status] || status;
}

const ASSET_LABEL = { characters: '角色', settings: '场景', props: '道具' };

async function renderAssets() {
  const el = $('asset-view');
  if (!el || !currentProjectId) return;
  let assets;
  try {
    assets = await api(`/api/projects/${currentProjectId}/assets`);
  } catch (e) { el.innerHTML = ''; return; }
  const roles = {};
  ((currentBible && currentBible.characters) || []).forEach(c => { roles[c.id] = c.role; });
  const card = (kind, a) => {
    const base = `/api/projects/${currentProjectId}/assets/${kind}/${encodeURIComponent(a.id)}/reference`;
    const usage = [
      a.chapters.length ? `${a.chapters.length} 章` : '',
      a.shots ? `${a.shots} 个镜头` : '',
    ].filter(Boolean).join(' · ') || '尚未出场';
    const role = kind === 'characters' && roles[a.id] ? `<span class="asset-role">${esc(roles[a.id])}</span>` : '';
    const desc = a.description || a.visual_prompt || (a.aliases || []).join(' / ') || '—';
    return `<div class="asset-card kind-${kind}">
      <div class="asset-img">
        ${a.has_reference
          ? `<img alt="${esc(a.name)}" loading="lazy" src="${withToken(`${base}?t=${Date.now()}`)}" />`
          : `<span class="ph">${ASSET_ICON[kind]}</span>`}
        <span class="state ${a.has_reference ? 'ok' : ''}">${a.has_reference ? '已有参考图' : '无参考图'}</span>
      </div>
      <div class="asset-info">
        <div class="asset-name">${esc(a.name)} ${role}</div>
        <div class="asset-desc" title="${esc(desc)}">${esc(desc)}</div>
        <div class="asset-usage">${esc(usage)}</div>
        <div class="asset-actions">
          <button class="btn btn-xs btn-green" title="${ASSET_HINT[kind]}（按张计费）"
                  onclick="generateAssetReference('${kind}', '${esc(a.id)}', ${a.has_reference})">
            ${a.has_reference ? 'AI 重画' : 'AI 生成'}
          </button>
          <label class="ref-upload">${a.has_reference ? '换图' : '上传'}
            <input type="file" accept="image/png,image/jpeg,image/webp"
                   onchange="uploadAssetReference('${kind}', '${esc(a.id)}', this)" />
          </label>
          ${a.has_reference ? `<button class="btn btn-xs btn-outline" onclick="clearAssetReference('${kind}', '${esc(a.id)}')">清除</button>` : ''}
        </div>

// ── 剧本 ────────────────────────────────────────────────────────────

// ── 长篇剧集大纲（20+ 章，选章展开成剧本）────────────────────
// 剧情「太简略/太平淡」的根因是直接让模型写 4 场就开拍：没有全篇因果链，
// 每场只能靠套话推进。这里先出完整骨架，再由人选章展开。

const selectedChapters = new Set();

function chapterExpectedSec(ch) {
  return ch.duration_budget_sec || (ch.scene_budget || 3) * 12;
}

function renderStoryOutline() {
  const el = $('story-panel');
  if (!el) return;
  const outline = currentStoryOutline;
  const p = currentProject;
  if (!outline) {
    el.innerHTML = '';
    return;
  }
  const done = new Set((currentScript ? currentScript.scenes.map(s => s.id) : []));
  const outlineScenes = (currentOutlineData && currentOutlineData.scenes) || [];
  const expanded = new Set(outlineScenes.map(s => s.chapter_id).filter(Boolean));
  const secPerDollar = (modelInfo && modelInfo.prices && modelInfo.prices.video_per_second) || 0;
  const picked = outline.chapters.filter(c => selectedChapters.has(c.id));
  const pickedSec = picked.reduce((a, c) => a + chapterExpectedSec(c), 0);
  const pickedNew = picked.filter(c => !expanded.has(c.id)).length;
  const costHint = secPerDollar > 0
    ? `≈$${(pickedSec * secPerDollar).toFixed(2)} 视频费`
    : '视频费以「成本预估」为准';
  const canEdit = ['draft', 'failed', 'script_review'].includes(p.status);
  const novelMode = p.input_mode === 'novel';

  el.innerHTML = `
    <div class="story-outline">
      <div class="story-head">
        <strong>${esc(outline.title || '长篇大纲')}</strong>
        <span class="tag-mini">${outline.chapters.length} 章</span>
        <span class="tag-mini">${expanded.size} 章已展开</span>
        ${outline.logline ? `<span style="font-size:12px;color:var(--text2)">${esc(outline.logline)}</span>` : ''}
      </div>
      ${outline.synopsis ? `<div class="story-synopsis">${esc(outline.synopsis)}</div>` : ''}
      <div class="chapter-list">
        ${outline.chapters.map(c => `
          <div class="chapter-card ${expanded.has(c.id) ? 'expanded' : ''}">
            <label class="chapter-pick">
              <input type="checkbox" ${selectedChapters.has(c.id) ? 'checked' : ''}
                     ${canEdit ? '' : 'disabled'}
                     onchange="toggleChapter('${c.id}', this.checked)">
              <span class="chapter-title">${esc(c.id)} · ${esc(c.title)}</span>
              ${expanded.has(c.id) ? '<span class="tag-mini ok">已展开</span>' : ''}
              ${novelMode && !c.source_extracted ? '<span class="tag-mini warn">未抽取</span>' : ''}
              <span class="tag-mini">${c.scene_budget || 3} 场 / 约 ${chapterExpectedSec(c)}s</span>
            </label>
            <div class="chapter-body">
              ${c.summary ? `<div>${esc(c.summary)}</div>` : `<div style="color:var(--text2)">${esc(c.brief)}</div>`}
              ${(c.beats && c.beats.length) ? `<ul>${c.beats.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
              ${c.hook ? `<div class="chapter-hook">章末钩子：${esc(c.hook)}</div>` : ''}
              ${(c.characters || []).length || (c.locations || []).length || (c.props || []).length ? `<div style="margin-top:4px">${[
                (c.characters || []).length ? `👤 ${esc(namesOf('characters', c.characters))}` : '',
                (c.locations || []).length ? `📍 ${esc(namesOf('settings', c.locations))}` : '',
                (c.props || []).length ? `🔑 ${esc(namesOf('props', c.props))}` : '',
              ].filter(Boolean).join(' · ')}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <div class="panel-actions">
        ${canEdit ? `
          <button class="btn btn-sm btn-green" onclick="doGenerateChapters()"
                  ${pickedNew ? '' : 'disabled'}>
            生成选中章节的剧本（${pickedNew} 章 / 约 ${pickedSec}s / ${costHint}）
          </button>
          <button class="btn btn-sm btn-outline" onclick="selectAllChapters(false)">清空选择</button>
          <button class="btn btn-sm btn-outline" onclick="selectUnexpandedChapters()">选中未展开的章</button>
        ` : '<span class="hint">剧本已确认：如需继续加章，先退回剧本阶段</span>'}
      </div>
      ${novelMode && canEdit ? `
        <div class="panel-actions">
          <button class="btn btn-sm btn-outline" onclick="doExtractChapters()" ${picked.length ? '' : 'disabled'}>
            只抽取选中章的资产（不写剧本，只花 LLM 的钱）
          </button>
        </div>` : ''}
      ${novelMode && outline.chapters.some(c => !c.source_extracted)
        ? `<div class="hint">有 ${outline.chapters.filter(c => !c.source_extracted).length} 章尚未抽取：勾选后生成剧本时会先抽取并合并进圣经（已有角色 id 不变）</div>`
        : (!novelMode && outline.chapters.some(c => !c.summary && !(c.beats || []).length))
        ? `<div class="hint" style="color:var(--yellow)">有 ${outline.chapters.filter(c => !c.summary && !(c.beats || []).length).length} 章只有骨架（正文没写完，可重新生成大纲续写）</div>` : ''}
    </div>
  `;
}

function toggleChapter(id, checked) {
  if (checked) selectedChapters.add(id); else selectedChapters.delete(id);
  renderStoryOutline();
}

function selectAllChapters(checked) {
  selectedChapters.clear();
  if (checked && currentStoryOutline) {
    currentStoryOutline.chapters.forEach(c => selectedChapters.add(c.id));
  }
  renderStoryOutline();
}

function selectUnexpandedChapters() {
  selectedChapters.clear();
  const expanded = new Set(((currentOutlineData && currentOutlineData.scenes) || [])
    .map(s => s.chapter_id).filter(Boolean));
  (currentStoryOutline ? currentStoryOutline.chapters : [])
    .filter(c => !expanded.has(c.id))
    .forEach(c => selectedChapters.add(c.id));
  renderStoryOutline();
}

function doGenerateStoryOutline() {
  const n = (modelInfo && modelInfo.story_chapters) || 20;
  if (!confirm(`生成长篇大纲：${n} 章骨架 + 逐章正文（多次 LLM 调用，约 $0.05，不花视频费）。继续？`)) return;
  withBusy(`生成长篇大纲中（${n} 章，约 1-3 分钟）...`, () =>
    api(`/api/projects/${currentProjectId}/story-outline/generate`, {
      method: 'POST', body: JSON.stringify({ chapters: n, model: currentModel() }),
    }));
}

function doExtractChapters() {
  const ids = [...selectedChapters];
  if (!ids.length) return alert('先勾选章节');
  withBusy(`抽取 ${ids.length} 章的人物/场景/道具...`, () =>
    api(`/api/projects/${currentProjectId}/novel/extract`, {
      method: 'POST', body: JSON.stringify({ chapters: ids, model: currentModel() }),
    }));
}

function doGenerateChapters() {
  const ids = [...selectedChapters];
  if (!ids.length) return alert('先勾选要拍的章节');
  const picked = currentStoryOutline.chapters.filter(c => ids.includes(c.id));
  const sec = picked.reduce((a, c) => a + chapterExpectedSec(c), 0);
  if (!confirm(`把 ${ids.length} 章展开成剧本（约 ${sec} 秒成片）。\n\n注意：这会作废已生成的分镜与媒体（片段要重跑才对应）。继续？`)) return;
  withBusy(`展开 ${ids.length} 章为剧本（逐场生成，约 1-3 分钟）...`, () =>
    api(`/api/projects/${currentProjectId}/script/generate`, {
      method: 'POST', body: JSON.stringify({ chapters: ids, model: currentModel() }),
    }));
}

// ── 分镜 ────────────────────────────────────────────────────────────

function renderStoryboard() {
  try {
    const sb = currentStoryboard;
    if (!sb || !$('storyboard-view')) return;
    $('btn-storyboard-edit').style.display = '';
    $('storyboard-view').innerHTML = storyboardTierHint(sb) + segmentSummary(sb) + groupBySegment(sb.shots).map(group => {
      const blocks = group.items.map(({ shot, index }) => shotBlockHtml(shot, index)).join('');
      if (!group.id || group.items.length < 2) return blocks;
      const total = group.items.reduce((a, x) => a + x.shot.duration_sec, 0);
      const bars = group.items.map(x => `<span style="flex:${x.shot.duration_sec}" title="${esc(x.shot.id)} · ${x.shot.duration_sec}s"></span>`).join('');
      return `<div class="segment-block">
        <div class="segment-head">
          <span class="seg-name">段落 ${esc(group.label)}</span>
          <span>${total}s · ${group.items.length} 镜 · 一次生成、段内硬切</span>
          <span class="segment-timeline">${bars}</span>
          <span class="tag-mini">${esc(group.items[0].shot.scene_id)}</span>
        </div>
        ${blocks}
      </div>`;
    }).join('');
  } catch (e) { /* 面板渲染失败不应影响其它面板 */ }
}

// 段落分镜：相邻、同 segment_id 的镜头归成一组（没编段的镜头各自一组）
function groupBySegment(shots) {
  const groups = [];
  shots.forEach((shot, index) => {
    const last = groups[groups.length - 1];
    if (shot.segment_id && last && last.id === shot.segment_id) {
      last.items.push({ shot, index });
    } else {
      groups.push({ id: shot.segment_id || '', items: [{ shot, index }] });
    }
  });
  let n = 0;
  groups.forEach(g => { if (g.id && g.items.length > 1) g.label = String(++n); });
  return groups;
}

function segmentSummary(sb) {
  const groups = groupBySegment(sb.shots).filter(g => g.id && g.items.length > 1);
  if (!groups.length) return '';
  const merged = groups.reduce((a, g) => a + g.items.length, 0);
  return `<div class="hint" style="margin-bottom:10px">段落分镜：${sb.shots.length} 个镜头编成
    ${groupBySegment(sb.shots).length} 次视频生成（${merged} 个镜头合进 ${groups.length} 段，段内硬切、生成后自动切回单镜）</div>`;
}

function shotBlockHtml(s, si) {
  return `
      <div class="shot-block" id="shot-${si}">
        <div class="shot-header">
          <span class="shot-no">${s.shot_no}</span>
          <span class="camera">${esc(s.camera)}</span>

          <span class="tag-mini">${esc(s.scene_id)}</span>
          ${(s.character_in_frame || []).length ? `<span class="tag-mini" title="出镜角色">👤 ${esc(namesOf('characters', s.character_in_frame))}</span>` : ''}
          ${s.location ? `<span class="tag-mini" title="场景">📍 ${esc(assetName('settings', s.location))}</span>` : ''}
          ${(s.props_in_frame || []).length ? `<span class="tag-mini" title="关键道具">🔑 ${esc(namesOf('props', s.props_in_frame))}</span>` : ''}
          ${s.dialogue_text ? `<span style="color:var(--accent2)" title="${esc(s.dialogue_speaker)}">💬 ${esc(speakerName(s.dialogue_speaker))}</span>` : ''}
        </div>
        <div>${esc(s.visual_description)}</div>
        ${s.video_prompt ? `<div class="prompt">${esc(s.video_prompt)}</div>` : ''}
        <div class="shot-actions">
          <button class="btn btn-sm btn-outline" onclick="toggleShotEdit(${si})">编辑</button>
        </div>
        <div class="edit-form" id="shot-edit-${si}">
          <div class="row">
            <div>
              <label>镜头号</label>
              <input id="sh-${si}-no" type="number" value="${s.shot_no}">
            </div>
            <div>
              <label>时长 (秒)</label>
              <input id="sh-${si}-duration" type="number" value="${s.duration_sec}">
            </div>
          </div>
          <label>运镜 (camera)</label>
          <input id="sh-${si}-camera" value="${esc(s.camera)}">
          <label>画面描述</label>
          <textarea id="sh-${si}-visual">${esc(s.visual_description)}</textarea>
          <label>情绪 (mood)</label>
          <input id="sh-${si}-mood" value="${esc(s.mood)}">
          <label>Video Prompt (英文)</label>
          <textarea id="sh-${si}-prompt" style="min-height:60px;font-family:monospace">${esc(s.video_prompt)}</textarea>
          <div class="row">
            <div>
              <label>台词</label>
              <input id="sh-${si}-dialogue" value="${esc(s.dialogue_text || '')}">
            </div>
            <div>
              <label>说话人</label>
              <input id="sh-${si}-speaker" value="${esc(s.dialogue_speaker || '')}">
            </div>
          </div>
          <label>旁白 (narration)</label>
          <input id="sh-${si}-narration" value="${esc(s.narration || '')}">
          <div class="form-actions">
            <button class="btn btn-sm btn-green" onclick="saveShot(${si})">保存此镜</button>
            <button class="btn btn-sm btn-outline" onclick="toggleShotEdit(${si})">取消</button>
          </div>
        </div>
      </div>
  `;
}

function storyboardTierHint(sb) {
  const tier = sb.duration_tier;
  const plan = (currentPreflight && currentPreflight.video) || null;
  const rows = [];
  const segmented = (sb.shots || []).some(x => x.segment_id);
  if (tier && tier.min_sec > 1) {
    const span = tier.max_sec ? `${tier.min_sec}~${tier.max_sec}s` : `≥${tier.min_sec}s`;
    const source = tier.source === 'provider' ? '来自模型' : '来自配置';
    rows.push(segmented
      ? `视频档位 ${esc(span)}（${source}）：按段计费，段内的短镜头不会各自被抬到最短档位`
      : `视频档位 ${esc(span)}（${source}）：每个镜头都不短于最短计费时长，所以不会出现「买 ${tier.min_sec} 秒只剪 3 秒」`);
  }
  if (plan && plan.shots_total) {
    const unit = plan.segment_mode ? `（编成 ${plan.segments_total} 段生成）` : '';
    rows.push(plan.to_generate
      ? `本次要生成 ${plan.to_generate} 个镜头${unit} · 预计计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ ${usd(plan.estimated_usd)}`
      : `本片 ${plan.shots_total} 个镜头${unit}已全部生成 · 整片计费约 ${plan.billed_seconds_if_all}s × $${plan.price_per_second}/s ≈ ${usd(plan.estimated_usd_if_all)}`);
    if (plan.merge_plan && plan.merge_plan.worth_it) {
      rows.push(`还可以合并短镜头省 ≈ ${usd(plan.merge_plan.saving_usd)}`);
    }
  }
  const warnings = sb.tier_warnings || [];
  const warn = warnings.length
    ? `<br>⚠️ ${warnings.map(esc).join('<br>⚠️ ')}` : '';
  if (!rows.length && !warn) return '';
  return `<div class="hint" style="margin-bottom:8px">${rows.join('<br>')}${warn}</div>`;
}

function toggleShotEdit(si) {
  const elem = $(`shot-edit-${si}`);
  if (elem) elem.classList.toggle('active');
}

async function saveShot(si) {
  if (!currentStoryboard) return;
  const shot = currentStoryboard.shots[si];
  shot.shot_no = parseInt($(`sh-${si}-no`).value) || shot.shot_no;
  shot.duration_sec = parseInt($(`sh-${si}-duration`).value) || shot.duration_sec;
  shot.camera = $(`sh-${si}-camera`).value;
  shot.visual_description = $(`sh-${si}-visual`).value;
  shot.mood = $(`sh-${si}-mood`).value;
  shot.video_prompt = $(`sh-${si}-prompt`).value;
  shot.dialogue_text = $(`sh-${si}-dialogue`).value || null;
  shot.dialogue_speaker = $(`sh-${si}-speaker`).value || null;
  shot.narration = $(`sh-${si}-narration`).value || null;

  try {
    await api(`/api/projects/${currentProjectId}/storyboard`, { method: 'PUT', body: JSON.stringify(currentStoryboard) });
    await refresh();
  } catch (e) {
    alert('保存失败: ' + e.message);
  }
}

async function saveStoryboard() {
  const errEl = $('storyboard-error');
  errEl.textContent = '';
  try {
    const data = JSON.parse($('storyboard-json').value);
    await api(`/api/projects/${currentProjectId}/storyboard`, { method: 'PUT', body: JSON.stringify(data) });
    cancelEdit('storyboard');
    await refresh();
  } catch (e) {
    errEl.textContent = e.message;
  }
}

function startEdit(kind) {
  const view = $(`${kind}-view`);
  const editor = $(`${kind}-editor`);
  const textarea = $(`${kind}-json`);
  const data = { bible: currentBible, script: currentScript, storyboard: currentStoryboard }[kind];

  textarea.value = JSON.stringify(data, null, 2);
  view.style.display = 'none';

function cancelEdit(kind) {
  const view = $(`${kind}-view`);
  const editor = $(`${kind}-editor`);

  editor.classList.remove('active');

// ── 视频片段 ────────────────────────────────────────────────────────

function stopVideoPolling() {
  if (videoPollTimer) { clearTimeout(videoPollTimer); videoPollTimer = null; }
}

function clipStatusLabel(status) {
  return ({ pending: '待生成', generating: '生成中', ready: '就绪', failed: '失败', skipped: '跳过' })[status] || status;
}

function videoHint(status) {
  if (status === 'storyboard_review') return '请先确认分镜，再生成视频片段';
  if (status === 'video_generating') return '正在生成…';
  if (status === 'video_ready') return '片段已就绪，可以生成配音';
  if (currentVideo && currentVideo.manifest && currentVideo.manifest.provider === 'openrouter') {
    return '真实模型按秒计费（最短 5 秒/镜头），预算不足会在提交前被拒绝';
  }
  if (status === 'audio_ready') return '片段已就绪，可以补跑失败镜头或直接合成';
  if (status === 'done') return '已出片；补跑镜头会让成片作废，需要重新合成';
  return '确认分镜后可生成视频片段';
}

function renderVideo() {
  const body = $('video-body');
  const actions = $('video-actions');
  if (!body || !actions) return;

  const v = currentVideo || {};
  const job = v.job;
  const summary = v.summary;
  const active = !!(job && job.is_active);
  const status = currentProject ? currentProject.status : '';

  const usedModel = (v.manifest && v.manifest.model) || '';
  $('video-tags').innerHTML = summary
    ? `<span class="tag-mini">${summary.ready}/${summary.total} 片段</span>` +
      (usedModel ? `<span class="tag-mini">${esc(usedModel)}</span>` : '') +
      (summary.failed ? `<span class="tag-mini warn">${summary.failed} 失败</span>` : '') +
      (summary.placeholder ? `<span class="tag-mini warn">${summary.placeholder} 占位</span>` : '') +
      (summary.usable ? '<span class="tag-mini ok">可进合成</span>' : '')
    : '';

  const clips = (v.manifest && v.manifest.clips) || [];
  if (!clips.length) {
    body.innerHTML = `<span style="color:var(--text2);font-size:12px">尚未生成${
      status === 'storyboard_review' ? '（请先确认分镜）' : ''}</span>`;
  } else {
    const shots = {};
    ((currentStoryboard && currentStoryboard.shots) || []).forEach(s => { shots[s.id] = s; });
    body.innerHTML = `<div class="clip-grid">${clips.map(c => {
      const shot = shots[c.shot_id] || {};
      const playable = c.status === 'ready' && c.media_kind === 'video';
      const statusClass = c.status === 'failed' ? 'warn' : c.status === 'ready' ? 'ok' : '';
      return `
        <div class="clip-card ${c.status === 'ready' ? '' : 'pending'}">
          <div class="clip-head">
            <span class="clip-no">#${shot.shot_no != null ? shot.shot_no : '?'}</span>
            <span class="tag-mini">${esc(c.scene_id || '')}</span>
            ${c.segment_id ? `<span class="seg-chip" title="与同段镜头一次生成后切出">${esc(c.segment_id.replace(/^.*_seg_/, '段 '))}</span>` : ''}
            <span style="color:var(--text2)">${c.duration_sec}s</span>
            <span class="tag-mini ${statusClass}">${esc(clipStatusLabel(c.status))}</span>
            ${c.media_kind === 'placeholder' ? '<span class="tag-mini warn">占位文件</span>' : ''}
          </div>
          ${playable
            ? `<video controls preload="metadata" src="${withToken(`/api/projects/${currentProjectId}/clips/${encodeURIComponent(c.shot_id)}`)}"></video>`
            : `<div style="font-size:11px;color:var(--text2)">${
                c.media_kind === 'placeholder' ? '未检测到 ffmpeg，仅写了占位文件' : '等待生成…'}</div>`}
          ${c.prompt ? `<div class="clip-prompt">${esc(c.prompt)}</div>` : ''}
          ${c.error ? `<div class="clip-error">${esc(c.error)}</div>` : ''}
        </div>`;
    }).join('')}</div>`;
  }

  const wrap = $('video-progress');
  if (active) {
    wrap.style.display = '';
    $('video-progress-fill').style.width = `${job.percent || 0}%`;
    $('video-progress-text').textContent =
      `${job.message || '生成中'}（${job.percent || 0}%，任务 ${job.id}）`;
  } else {
    wrap.style.display = 'none';
  }

  const canStart = ['storyboard_confirmed', 'video_ready', 'audio_ready', 'done'].includes(status) && !active;
  const buttons = [];
  const planLine = videoPlanLine(status);
  if (planLine) buttons.push(`<div class="hint" style="flex-basis:100%">${planLine}</div>`);
  if (active) {
    buttons.push('<button class="btn btn-sm btn-danger" onclick="doCancelVideo()">取消生成</button>');
  }
  if (canStart) {
    const hasClips = summary && (summary.ready || summary.failed);
    const plan = (currentPreflight && currentPreflight.video) || null;
    // 换模型/provider 后旧片段会全部重跑，按钮文案必须说清楚（否则「生成缺失片段」是骗人的）
    const label = plan && plan.regenerate_all ? `重新生成全部 ${plan.to_generate} 个片段`
      : !hasClips ? '生成视频片段'
      : summary.failed ? `重试 ${summary.failed} 个失败镜头`
      : '生成缺失片段';
    buttons.push(`<button class="btn btn-sm" onclick="doGenerateVideo()">${label}</button>`);
  }
  if (!buttons.length) {
    buttons.push(`<span class="hint">${esc(videoHint(status))}</span>`);
  }
  actions.innerHTML = buttons.join('');

  if (active) scheduleVideoPoll(); else stopVideoPolling();
}

function scheduleVideoPoll() {
  stopVideoPolling();
  videoPollTimer = setTimeout(refreshVideoPanel, 1500);
}

async function refreshVideoPanel() {
  if (!currentProjectId) return;
  const previousJobId = currentVideo && currentVideo.job ? currentVideo.job.id : null;
  const status = await safeGet(`/api/projects/${currentProjectId}/video/status`);
  if (!status) return;
  currentVideo = status;

  const job = status.job;
  const active = !!(job && job.is_active);
  renderVideo();

  // 任务刚结束 → 整体刷新，更新项目状态标签
  if (!active && job && job.id === previousJobId) {
    await refresh();
  }
}

// ── 成本前置（preflight）─────────────────────────────────────────────

let currentPreflight = null;

async function loadPreflight(action) {
  if (!currentProjectId) return null;
  currentPreflight = await safeGet(
    `/api/projects/${currentProjectId}/preflight?action=${action || 'all'}&script_mode=${audioScriptMode}`
  );
  return currentPreflight;
}

function videoPlanLine(status) {
  const plan = currentPreflight && currentPreflight.video;
  if (!plan || !plan.shots_total) return '';
  if (status === 'storyboard_review') return '';
  const parts = [
    `本次生成 ${plan.to_generate}/${plan.shots_total} 个片段`,
    `计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ <strong>${usd(plan.estimated_usd)}</strong>`,
    plan.price_source === 'config' ? '（单价取配置）' : '',
  ].filter(Boolean).join(' · ');
  const extra = [];
  if (plan.regenerate_all) extra.push(`⚠️ ${esc(plan.regenerate_reason)}：已就绪的 ${plan.existing_ready} 个片段要全部重跑`);
  if (plan.budget && plan.budget.limited) {
    extra.push(`预算剩余 ${usd(plan.budget.remaining_usd)}` +
      (plan.budget.over_budget ? `（不足，还差 ${usd(plan.budget.shortfall_usd)}，会被拒绝）` : ''));
  }
  const merge = plan.merge_plan;
  if (merge && merge.worth_it) {
    extra.push(`合并短镜头：${merge.from_shots} → ${merge.to_shots} 个可省 ≈ ${usd(merge.saving_usd)}`);
  }
  return parts + (extra.length ? '<br>' + extra.join('<br>') : '');
}

function planConfirmText(plan) {
  const lines = [
    `将生成 ${plan.to_generate} 个片段（共 ${plan.shots_total} 个镜头）`,
    `计费 ${plan.billed_seconds}s × $${plan.price_per_second}/s ≈ ${usd(plan.estimated_usd)}`,
  ];
  if (plan.regenerate_all) {
    lines.push(`⚠️ ${plan.regenerate_reason}：已就绪的 ${plan.existing_ready} 个片段会全部重新生成`);
  }
  if (plan.budget && plan.budget.limited) {
    lines.push(`预算 ${usd(plan.budget.budget_usd)} · 已花 ${usd(plan.budget.spent_usd)} · 剩余 ${usd(plan.budget.remaining_usd)}`);
  }
  lines.push('', '确认开始生成吗？');
  return lines.join('\n');
}

function doGenerateVideo() {
  stopVideoPolling();
  withBusy('估算花费...', async () => {
    const pre = await loadPreflight('video');
    const plan = pre && pre.video;
    if (!plan) throw new Error('拿不到成本预估，已取消提交');
    if (plan.budget && plan.budget.over_budget) {
      alert('预算不足，已取消提交：\n\n' + planConfirmText(plan) +
        `\n还差 ${usd(plan.budget.shortfall_usd)}（可改 BUDGET_USD=0 关闭限制）`);
      return;
    }
    // 免费（mock）就不用每次都点确认
    if (plan.estimated_usd > 0 || plan.regenerate_all) {
      if (!confirm(planConfirmText(plan))) return;
    }
    await api(`/api/projects/${currentProjectId}/video/generate`, { method: 'POST' });
  });
}

async function doMergeShots() {
  withBusy('试算合并...', async () => {
    const pre = await loadPreflight('video');
    const saving = pre && pre.video && pre.video.merge_plan ? pre.video.merge_plan.saving_usd : 0;
    const preview = await api(`/api/projects/${currentProjectId}/storyboard/merge-shots`, {
      method: 'POST',
      body: JSON.stringify({ dry_run: true }),
    });
    if (preview.to_shots >= preview.from_shots) {
      alert('没有可以合并的镜头：\n\n' + (preview.warnings || []).join('\n'));
      return;
    }
    const text = [
      `镜头：${preview.from_shots} → ${preview.to_shots} 个（每镜最短 ${preview.min_sec}s）`,
      `总时长：${preview.from_seconds}s → ${preview.to_seconds}s`,
      saving > 0 ? `视频计费预计省 ≈ ${usd(saving)}` : '',
      preview.dropped_lines && preview.dropped_lines.length
        ? `⚠️ 会丢掉 ${preview.dropped_lines.length} 条旁白（对白一条都不会丢）` : '',
      preview.force_required
        ? `⚠️ 已有 ${preview.ready_clips} 个可用片段，合并会让它们作废（重新生成要再花钱）` : '',
      '', '确认合并吗？（合并后镜头变少，无法自动还原）',
    ].filter(Boolean).join('\n');
    if (!confirm(text)) return;
    await api(`/api/projects/${currentProjectId}/storyboard/merge-shots`, {
      method: 'POST',
      body: JSON.stringify({
        dry_run: false,
        min_sec: preview.min_sec,
        force: !!preview.force_required,
      }),
    });
  });
}

function doCancelVideo() {
  withBusy('取消生成...', () =>
    api(`/api/projects/${currentProjectId}/video/cancel`, { method: 'POST' }));
}

  ['nova', 'nova · 女声（云端）'], ['shimmer', 'shimmer · 女声（云端）'],
  ['coral', 'coral · 女声（云端）'], ['sage', 'sage · 女声（云端）'],
  ['alloy', 'alloy · 中性（云端）'], ['echo', 'echo · 男声（云端）'],
  ['onyx', 'onyx · 男声（云端）'], ['ash', 'ash · 男声（云端）'],
  ['verse', 'verse · 男声（云端）'], ['ballad', 'ballad · 男声（云端）'],
  ['fable', 'fable · 中性（云端）'],
];
let TTS_PROVIDER = 'edge';
let EDGE_VOICES = [
  ['zh-CN-XiaoxiaoNeural', '晓晓 · 女声'],
  ['zh-CN-XiaoyiNeural', '晓伊 · 女声'],
  ['zh-CN-YunxiNeural', '云希 · 男声'],
  ['zh-CN-YunjianNeural', '云健 · 男声（旁白）'],
